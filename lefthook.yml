# 本地提交前检查,与 .github/workflows/ci.yml 双链一致(Go / Python / Mobile / Docs)。
# 仅在本地拦截问题,CI 仍是最终门禁(实施计划决策 #12:模型 wheel ~29MB,CI 只跑双链)。
# 单次跳过:git commit --no-verify(lefthook 也接受 LEFTHOOK=0)。
pre-commit:
  parallel: true
  commands:
    git-policy:
      run: bash scripts/git/check-commit.sh
    worktree-path:
      run: bash scripts/git/check-worktree.sh
    gofmt:
      glob: "**/*.go"
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then echo "需先 gofmt: $unformatted"; exit 1; fi
    go-vet:
      glob: "**/*.go"
      run: go vet ./...
    go-test:
      glob: "**/*.go"
      run: go test ./...
    ruff:
      glob: "recognizer/**/*.py"
      run: cd recognizer && uv run ruff check .
    pytest:
      glob: "recognizer/**/*.py"
      run: cd recognizer && uv run pytest
    mobile-typecheck:
      glob: "apps/mobile/**/*.{ts,tsx}"
      run: cd apps/mobile && npm run typecheck
    mobile-test:
      glob: "apps/mobile/**/*.{ts,tsx}"
      run: cd apps/mobile && npm test -- --silent
    mobile-codegen-sync:
      glob: "{apps/mobile/**/*.{ts,tsx},schemas/openapi.yaml}"
      run: cd apps/mobile && npm run codegen && git diff --exit-code -- src/api/schema.d.ts
    docs:
      run: python3 scripts/check-docs.py --staged
    path-case:
      run: python3 scripts/check-path-case.py --staged

pre-merge-commit:
  commands:
    git-policy:
      run: bash scripts/git/check-commit.sh

# core.hooksPath 自定义环境可能无法安装 commit-msg;pre-push 会兜底检查提交信息。
commit-msg:
  commands:
    git-policy:
      run: bash scripts/git/check-commit-msg.sh {1}

pre-push:
  commands:
    git-policy:
      run: bash scripts/git/check-push.sh {1}
      use_stdin: true
