<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HealthyDuoduo · 护理记录产品重心原型</title>
<style>
  :root {
    --text: #111827;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --ok: #15803d;
    --fail: #b91c1c;
    --low: #1d4ed8;
    --border: #d1d5db;
    --line: #e5e7eb;
    --soft: #f8fafc;
    --chip: #f3f4f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #e5e7eb;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body.clean { background: #fff; min-height: 844px; }
  body.clean .topbar,
  body.clean .screen-nav,
  body.clean .floating,
  body.clean .page-footer { display: none; }
  body.clean .page { max-width: none; padding: 0; }
  body.clean .stage { padding: 0; }
  body.clean .device {
    width: 390px; height: 844px; border: 0; border-radius: 0; box-shadow: none;
  }
  body.clean .notch { display: none; }

  .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 120px; }
  .topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 14px; }
  .kicker { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .brand h1 { font-size: 24px; line-height: 1.2; margin: 6px 0 6px; letter-spacing: -.3px; }
  .brand p { margin: 0; max-width: 720px; font-size: 13px; line-height: 20px; color: var(--muted); }
  .brand p b { color: var(--text); font-weight: 650; }
  .scenario-toggle { display: flex; flex: 0 0 auto; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
  .scenario-btn {
    border: 0; background: transparent; padding: 9px 14px; border-radius: 9px;
    font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .scenario-btn.active { background: var(--text); color: #fff; }
  .screen-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .screen-pill {
    border: 1px solid var(--border); background: #fff; color: var(--text);
    border-radius: 999px; padding: 7px 12px; font-size: 12px; cursor: pointer;
  }
  .screen-pill.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .prototype-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .tool-btn {
    border: 1px solid var(--border); background: #fff; color: var(--muted);
    border-radius: 999px; padding: 6px 10px; font-size: 11px; cursor: pointer;
  }
  .tool-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .stage { display: flex; justify-content: center; }
  .device {
    width: 390px; height: 844px; position: relative; overflow: hidden;
    background: #fff; border: 10px solid #111827; border-radius: 46px;
    box-shadow: 0 24px 70px rgba(0,0,0,.28);
  }
  .notch {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 25px; border-radius: 16px; background: #111827; z-index: 50;
  }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; background: #fff; }

  .statusbar {
    flex: 0 0 44px; height: 44px; padding: 0 22px 6px;
    display: flex; align-items: flex-end; justify-content: space-between;
    font-size: 12px; font-weight: 650; color: var(--text);
  }
  .status-right { display: flex; align-items: center; gap: 5px; font-size: 10px; letter-spacing: -.5px; }
  .signal { letter-spacing: -1px; }
  .battery {
    width: 20px; height: 10px; border: 1px solid var(--text); border-radius: 2px;
    position: relative; display: inline-block;
  }
  .battery::after {
    content: ""; position: absolute; right: -3px; top: 3px; width: 2px; height: 4px;
    background: var(--text); border-radius: 0 1px 1px 0;
  }
  .battery i { display: block; height: 6px; margin: 1px; width: 72%; background: var(--text); border-radius: 1px; }

  .appbar {
    flex: 0 0 52px; height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid #f1f5f9; background: #fff;
  }
  .appbar .back {
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    margin-left: -7px; color: var(--text); cursor: pointer;
  }
  .appbar .title {
    flex: 1; min-width: 0; font-size: 17px; font-weight: 650; letter-spacing: .1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .appbar .right { color: var(--accent); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .appbar .right.muted { color: var(--muted); }

  .content { flex: 1; overflow-y: auto; padding: 16px 16px 30px; scrollbar-width: none; }
  .content::-webkit-scrollbar { display: none; }
  .content.has-tab { padding-bottom: 86px; }

  .tabbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex;
    border-top: 1px solid var(--line); background: #fff; z-index: 10;
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 10px; color: var(--muted); cursor: pointer;
  }
  .tab.active { color: var(--accent); }
  .tab svg { width: 21px; height: 21px; }
  .tab { position: relative; }
  .tab-badge {
    position: absolute; top: 7px; right: calc(50% - 19px);
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }
  .subtabs {
    flex: 0 0 44px; height: 44px; display: flex; align-items: flex-end; gap: 22px;
    padding: 0 16px; border-bottom: 1px solid #f1f5f9; background: #fff;
  }
  .subtab {
    padding: 0 1px 11px; font-size: 14px; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  .subtab.active { color: var(--text); font-weight: 650; border-bottom-color: var(--accent); }
  .domain-appbar { align-items: flex-end; padding-bottom: 0; }
  .domain-tabs { display: flex; gap: 18px; align-items: flex-end; flex: 1; }
  .domain-tab {
    padding: 0 1px 12px; font-size: 15px; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .domain-tab.active { color: var(--text); font-weight: 650; border-bottom-color: var(--accent); }
  .domain-tab .dot {
    display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); margin-left: 4px; vertical-align: 2px;
  }
  .domain-appbar .member { color: var(--accent); font-size: 12px; padding-bottom: 13px; white-space: nowrap; }
  .welcome { padding: 22px 4px 0; }
  .welcome-icon {
    width: 52px; height: 52px; border-radius: 16px; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center; margin-bottom: 14px;
  }
  .welcome h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.3px; }
  .welcome p { margin: 0 0 18px; color: var(--muted); font-size: 13px; line-height: 20px; }
  .choice {
    width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 14px;
    background: #fff; padding: 14px 14px; margin-bottom: 10px; cursor: pointer;
    font-family: inherit; color: var(--text);
  }
  .choice b { display: block; font-size: 15px; }
  .choice small { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
  .choice:active { background: var(--soft); }
  .welcome-note {
    margin-top: 14px; border-radius: 12px; background: var(--soft); padding: 11px 12px;
    font-size: 11px; line-height: 17px; color: var(--muted);
  }

  .card {
    border: 1px solid var(--line); border-radius: 12px; padding: 13px;
    background: #fff; margin-bottom: 10px;
  }
  .card.soft { background: var(--soft); }
  .card.accent { border-color: #bfdbfe; background: #f8fbff; }
  .section-title {
    display: flex; align-items: center; justify-content: space-between;
    margin: 18px 2px 8px; font-size: 13px; color: var(--muted);
  }
  .section-title:first-child { margin-top: 0; }
  .section-title b { color: var(--text); font-size: 13px; font-weight: 650; }
  .link { color: var(--accent); text-decoration: none; cursor: pointer; font-size: 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; line-height: 18px; }
  .tag {
    display: inline-flex; align-items: center; border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 6px; font-size: 10px; color: var(--muted);
    background: #fff; white-space: nowrap;
  }
  .chips { display: flex; gap: 8px; margin-bottom: 12px; }
  .chip {
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
    font-size: 12px; color: var(--text); background: #fff; cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .member-head { display: flex; align-items: center; gap: 8px; }
  .member-name { font-size: 17px; font-weight: 650; }
  .badge-child {
    font-size: 10px; color: var(--accent); background: var(--accent-soft);
    border: 1px solid #bfdbfe; border-radius: 999px; padding: 1px 6px;
  }
  .member-line { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; font-size: 13px; }
  .member-line .pending { color: var(--accent); font-weight: 650; }
  .care-row {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
    display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .care-icon {
    width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center; flex: 0 0 34px;
  }
  .care-copy { flex: 1; min-width: 0; }
  .care-title { font-size: 13px; font-weight: 650; }
  .care-meta { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .chev { color: #9ca3af; flex: 0 0 auto; }

  .hero {
    background: linear-gradient(135deg, #eff6ff 0%, #ffffff 78%);
    border: 1px solid #bfdbfe; border-radius: 16px; padding: 15px 16px 13px; margin-bottom: 12px;
  }
  .hero-eyebrow { font-size: 12px; color: var(--accent); font-weight: 650; letter-spacing: .02em; }
  .hero-num { font-size: 30px; line-height: 1.15; font-weight: 750; letter-spacing: -.6px; margin-top: 4px; }
  .hero-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .hero-foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 11px; padding-top: 9px; border-top: 1px solid #dbeafe; font-size: 11px; color: var(--muted);
  }

  .quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .quick {
    border: 1px solid var(--line); background: #fff; border-radius: 12px;
    padding: 9px 3px 8px; display: flex; flex-direction: column; align-items: center; gap: 5px;
    font-size: 11px; color: var(--text); cursor: pointer;
  }
  .quick:active { background: var(--soft); }
  .qicon {
    width: 34px; height: 34px; border-radius: 50%; background: var(--soft);
    display: flex; align-items: center; justify-content: center; color: var(--accent);
  }

  .summary-strip {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; margin-bottom: 12px;
  }
  .summary-cell { background: #fff; padding: 10px 6px; text-align: center; }
  .summary-val { font-size: 16px; font-weight: 700; letter-spacing: -.2px; }
  .summary-label { font-size: 10px; color: var(--muted); margin-top: 2px; }

  .timeline { position: relative; }
  .event {
    display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f1f5f9;
    cursor: pointer;
  }
  .event:last-child { border-bottom: 0; }
  .event-time {
    width: 44px; flex: 0 0 44px; padding-top: 2px; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .event-icon {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; background: var(--soft);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
  }
  .event-body { flex: 1; min-width: 0; }
  .event-title { font-size: 14px; font-weight: 550; }
  .event-meta { margin-top: 2px; font-size: 11px; color: var(--muted); }
  .event-meta .tag { margin-left: 5px; }

  .empty-state {
    padding: 30px 18px 34px; text-align: center; border: 1px dashed var(--border);
    border-radius: 12px; background: var(--soft); margin-top: 8px;
  }
  .empty-icon {
    width: 48px; height: 48px; border-radius: 50%; background: #fff; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; color: var(--accent);
  }
  .empty-title { font-size: 14px; font-weight: 650; }
  .empty-text { margin-top: 4px; font-size: 11px; line-height: 17px; color: var(--muted); }

  .reminder-card {
    display: flex; align-items: center; gap: 10px; border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 12px; margin-bottom: 12px; background: #fff; cursor: pointer;
  }
  .reminder-card .care-icon { background: #fff7ed; color: #b45309; }
  .reminder-copy { flex: 1; min-width: 0; }
  .reminder-title { font-size: 13px; font-weight: 650; display: block; }
  .reminder-meta { margin-top: 2px; font-size: 11px; color: var(--muted); display: block; }

  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .kpi { border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; background: #fff; }
  .kpi-label { font-size: 11px; color: var(--muted); }
  .kpi-value { margin-top: 3px; font-size: 21px; font-weight: 720; letter-spacing: -.3px; }
  .kpi-unit { margin-left: 2px; font-size: 10px; font-weight: 400; color: var(--muted); }

  .chart-card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 10px; margin-bottom: 10px; background: #fff; }
  .chart-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .chart-title { font-size: 13px; font-weight: 650; }
  .chart-sub { font-size: 10px; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 7px; height: 112px; padding-top: 4px; }
  .bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; }
  .bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; }
  .bar { width: 100%; max-width: 24px; border-radius: 5px 5px 2px 2px; background: #bfdbfe; position: relative; }
  .bar.today { background: var(--accent); }
  .bar-val { font-size: 9px; color: var(--muted); }
  .bar-label { font-size: 9px; color: var(--muted); white-space: nowrap; }

  .c-metric-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--chip); border-radius: 10px; padding: 3px; margin-bottom: 8px; }
  .c-metric {
    border: 0; background: transparent; border-radius: 8px; padding: 7px 0;
    font-size: 11px; color: var(--muted); cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  .c-metric.active { background: #fff; color: var(--text); font-weight: 650; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .c-type-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--chip); border-radius: 10px; padding: 3px; margin-bottom: 8px; }
  .c-type-tab {
    border: 0; background: transparent; border-radius: 8px; padding: 7px 0;
    font-size: 12px; color: var(--muted); cursor: pointer; font-family: inherit;
  }
  .c-type-tab.active { background: #fff; color: var(--text); font-weight: 650; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .c-question { margin: 2px 2px 9px; font-size: 11px; color: var(--muted); }
  .c-question b { color: var(--text); font-weight: 650; }
  .c-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 10px; }
  .c-kpi { border: 1px solid var(--line); border-radius: 10px; padding: 8px 9px; background: #fff; }
  .c-kpi-label { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .c-kpi-value { margin-top: 3px; font-size: 17px; font-weight: 720; letter-spacing: -.3px; white-space: nowrap; }
  .c-kpi-unit { margin-left: 1px; font-size: 9px; font-weight: 400; color: var(--muted); }
  .c-chart-card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 8px; background: #fff; margin-bottom: 9px; }
  .c-chart-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .c-chart-title { font-size: 12px; font-weight: 650; }
  .c-chart-sub { font-size: 9px; color: var(--muted); }
  .c-chart-body { height: 190px; position: relative; }
  .c-bars { display: flex; align-items: flex-end; gap: 7px; height: 100%; padding-top: 16px; }
  .c-bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-width: 0; }
  .c-bar-val { font-size: 9px; color: var(--muted); white-space: nowrap; }
  .c-bar-wrap { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
  .c-bar { width: 100%; max-width: 24px; border-radius: 5px 5px 2px 2px; background: #bfdbfe; }
  .c-bar.today { background: var(--accent); }
  .c-bar-label { font-size: 9px; color: var(--muted); white-space: nowrap; }
  .c-baseline { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid #e5e7eb; }
  .c-stack { width: 100%; max-width: 24px; display: flex; flex-direction: column-reverse; border-radius: 5px 5px 2px 2px; overflow: hidden; }
  .c-stack-seg { width: 100%; min-height: 1px; }
  .c-legend { display: flex; flex-wrap: wrap; gap: 5px 11px; margin-top: 3px; padding: 0 2px; }
  .c-legend-item { display: flex; align-items: center; gap: 4px; font-size: 9px; color: var(--muted); }
  .c-legend-dot { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
  .c-line-svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .c-line-svg text { font-family: inherit; }
  .c-caption { border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; background: var(--soft); margin-bottom: 8px; }
  .c-caption-title { font-size: 12px; font-weight: 650; }
  .c-caption-body { margin-top: 3px; font-size: 10px; line-height: 16px; color: var(--muted); }
  .c-caption-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .c-fit { font-size: 9px; border-radius: 999px; padding: 2px 7px; border: 1px solid #bbf7d0; color: var(--ok); background: #f0fdf4; }
  .c-not-fit { font-size: 9px; border-radius: 999px; padding: 2px 7px; border: 1px solid #fecaca; color: var(--fail); background: #fef2f2; }
  .c-recommend { border-left: 3px solid var(--accent); padding: 2px 0 2px 9px; font-size: 10px; line-height: 16px; color: var(--muted); margin-bottom: 10px; }
  .c-recommend b { color: var(--text); }

  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .switch {
    width: 46px; height: 28px; border-radius: 999px; background: #d1d5db; position: relative;
    cursor: pointer; flex: 0 0 46px; transition: background .18s;
  }
  .switch.on { background: var(--accent); }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .18s;
  }
  .switch.on::after { left: 21px; }
  .interval-row { display: flex; gap: 8px; margin-top: 12px; }
  .interval {
    flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 9px 0;
    text-align: center; font-size: 13px; color: var(--text); cursor: pointer; background: #fff;
  }
  .interval.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 650; }
  .notification {
    border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--soft);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .app-icon {
    width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; flex: 0 0 34px; font-size: 12px; font-weight: 700;
  }
  .notification-title { font-size: 12px; font-weight: 650; }
  .notification-body { margin-top: 2px; font-size: 11px; color: var(--muted); line-height: 16px; }

  .report-card { cursor: pointer; }
  .report-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .report-title { font-size: 15px; font-weight: 650; line-height: 21px; }
  .report-meta { margin-top: 4px; font-size: 11px; color: var(--muted); }
  .report-foot { margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .status { font-size: 11px; white-space: nowrap; }
  .status.pending { color: var(--accent); }
  .status.ok { color: var(--ok); }
  .status.fail { color: var(--fail); }

  .item-row {

<body>
  <div class="page">

<script>

  };

  const screenEl = document.getElementById('screen');

  const deviceEl = document.getElementById('device');
  let toastTimer = null;

  const ICONS = {
    home: '<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9.5Z"/>',
    archive: '<path d="M4 7h16M4 12h16M4 17h16"/>',
    stats: '<path d="M5 20V10M12 20V4M19 20v-7"/>',
    bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',
    bottle: '<path d="M9 3h6v3l2 2v13H7V8l2-2V3Z"/><path d="M9 11h6"/>',
    droplet: '<path d="M12 3s6 6.5 6 10a6 6 0 1 1-12 0c0-3.5 6-10 6-10Z"/>',
    moon: '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/>',
    bowl: '<path d="M4 11h16a8 8 0 0 1-16 0Z"/><path d="M8 3v4M12 2v5M16 3v4"/>',
    report: '<path d="M6 3h9l3 3v15H6V3Z"/><path d="M15 3v3h3M9 11h6M9 15h6"/>',
    back: '<path d="M15 18l-6-6 6-6"/>',
    chevron: '<path d="M9 18l6-6-6-6"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    settings: '<circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',
    filter: '<path d="M4 6h16M7 12h10M10 18h4"/>',
    more: '<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'
  };

  function icon(name, size = 20) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;');
  }

  function parseTime(value) {
    const [h, m] = String(value || '00:00').split(':').map(Number);
    return h * 60 + m;
  }

  function formatDuration(totalMinutes) {
    const mins = Math.max(0, totalMinutes);
    if (mins < 1) return '刚刚';
    if (mins < 60) return `${mins} 分钟`;
    const h = Math.floor(mins / 60);
    const m = mins % 60;
    return m ? `${h} 小时 ${m} 分` : `${h} 小时`;
  }

  function sortedEvents() {
    return [...state.events].sort((a, b) => parseTime(b.time) - parseTime(a.time));
  }

  function lastFeed() {
    return state.events
      .filter(e => e.type === 'feed')
      .sort((a, b) => parseTime(b.time) - parseTime(a.time))[0] || null;
  }

  function feedDetail(event) {
    if (!event) return '';
    if (event.method === 'breast') {
      return event.durationMin ? `母乳 · ${event.durationMin} 分钟` : '母乳';
    }
    return event.amount ? `奶粉 · ${event.amount} ml` : '奶粉';
  }

  function eventTitle(event) {
    if (event.type === 'feed') return feedDetail(event);
    if (event.type === 'diaper') return event.diaperType || '换尿布';
    if (event.type === 'sleep') return event.durationMin ? `${event.note || '睡觉'} · ${event.durationMin} 分钟` : `${event.note || '睡觉'} · 进行中`;
    if (event.type === 'solid') return `${event.food || '辅食'}${event.amount ? ` · ${event.amount} g` : ''}`;
    return '';
  }

  function eventMeta(event) {
    if (event.type === 'feed') return '喂奶';
    if (event.type === 'diaper') return '换尿布';
    if (event.type === 'sleep') return '睡觉';
    if (event.type === 'solid') return '辅食';
    return '';
  }

  function eventIcon(event) {
    if (event.type === 'feed') return 'bottle';
    if (event.type === 'diaper') return 'droplet';
    if (event.type === 'sleep') return 'moon';
    if (event.type === 'solid') return 'bowl';
    return 'clock';
  }

  function todayStats() {
    const feeds = state.events.filter(e => e.type === 'feed');
    return {
      feeds: feeds.length,
      amount: feeds.reduce((sum, e) => sum + (Number(e.amount) || 0), 0),
      diapers: state.events.filter(e => e.type === 'diaper').length,
      solids: state.events.filter(e => e.type === 'solid').length,
      sleepMin: state.events.filter(e => e.type === 'sleep').reduce((sum, e) => sum + (Number(e.durationMin) || 0), 0)
    };
  }

  function lastFeedSummary() {
    const last = lastFeed();
    if (!last) {
      return { number: '还没有记录', sub: '记录第一次喂奶后，这里会显示间隔' };
    }
    const diff = parseTime(NOW) - parseTime(last.time);
    return {
      number: formatDuration(Math.max(0, diff)),
      sub: `上次 ${last.time} · ${feedDetail(last)}`
    };
  }

  function statusbar() {
    return `<div class="statusbar">
      <span>9:41</span>
      <span class="status-right"><span class="signal">▂▄▆</span><span>5G</span><span class="battery"><i></i></span></span>
    </div>`;
  }

  function appbar(title, { back = false, right = '', rightMuted = false, rightScreen = '' } = {}) {
    const backHtml = back ? `<span class="back" data-action="back">${icon('back', 20)}</span>` : '';

      ? `<span class="right ${rightMuted ? 'muted' : ''}" ${rightScreen ? `data-action="nav" data-screen="${rightScreen}"` : 'data-action="toast" data-message="原型入口"'}">${right}</span>`
      : '';
    return `<div class="appbar">${backHtml}<div class="title">${esc(title)}</div>${rightHtml}</div>`;
  }

  function tabbar(tabs, active) {
    return `<div class="tabbar">${tabs.map(tab => `
      <div class="tab ${tab.id === active ? 'active' : ''}" data-action="nav" data-screen="${tab.screen}">
        ${icon(tab.icon, 21)}<span>${esc(tab.label)}</span>${tab.badge ? '<span class="tab-badge"></span>' : ''}
      </div>`).join('')}</div>`;
  }

  const TABS_A = [
    { id: 'family', label: '家庭', icon: 'home', screen: 'a-home' },
    { id: 'archive', label: '档案', icon: 'archive', screen: 'a-archive' }
  ];
  const TABS_B = [
    { id: 'today', label: '今天', icon: 'home', screen: 'b-home' },
    { id: 'stats', label: '统计', icon: 'stats', screen: 'b-stats' },
    { id: 'archive', label: '档案', icon: 'archive', screen: 'b-archive', badge: true }
  ];
  const TABS_C = [
    { id: 'daily', label: '日常', icon: 'home', screen: 'c-today' },

  function frame({ title, back = false, right = '', rightMuted = false, rightScreen = '', content, tabs = null, activeTab = '', subTabs = null, activeSubTab = '', domainTabs = '' }) {

  function cKpis(metric) {

  function cBarChart(metric) {
    const bars = metric.total.map((value, index) => {
      const height = Math.max(6, Math.round((value / metric.max) * 100));
      return `<div class="c-bar-col">
        <div class="c-bar-val">${value}</div>
        <div class="c-bar-wrap"><div class="c-bar ${index === metric.total.length - 1 ? 'today' : ''}" style="height:${height}%"></div></div>
        <div class="c-bar-label">${index === metric.total.length - 1 ? '今天' : metric.days[index]}</div>
      </div>`;
    }).join('');
    return `<div class="c-chart-card">
      <div class="c-chart-head"><span class="c-chart-title">${metric.title}</span><span class="c-chart-sub">单位：${metric.unit}</span></div>
      <div class="c-chart-body"><div class="c-baseline"></div><div class="c-bars">${bars}</div></div>
    </div>`;
  }

  function cStackedChart(metric) {
    const bars = metric.days.map((day, index) => {
      const total = metric.total[index];
      const stackHeight = Math.max(6, Math.round((total / metric.max) * 100));
      const segments = metric.segments.map(seg => {
        const share = total ? (seg.values[index] / total) * 100 : 0;
        return `<div class="c-stack-seg" style="height:${share}%;background:${seg.color}" title="${seg.label} ${seg.values[index]}"></div>`;
      }).join('');
      return `<div class="c-bar-col">
        <div class="c-bar-val">${total}</div>
        <div class="c-bar-wrap"><div class="c-stack" style="height:${stackHeight}%">${segments}</div></div>
        <div class="c-bar-label">${index === metric.days.length - 1 ? '今天' : day}</div>
      </div>`;
    }).join('');
    const legend = metric.segments.map(seg => {
      const sum = seg.values.reduce((a, b) => a + b, 0);
      const display = metric.unit === '小时' ? sum.toFixed(1) : Math.round(sum);
      return `<span class="c-legend-item"><i class="c-legend-dot" style="background:${seg.color}"></i>${seg.label} ${display}${metric.unit === '小时' ? ' h' : metric.unit === 'ml' ? ' ml' : ' 次'}</span>`;
    }).join('');
    return `<div class="c-chart-card">
      <div class="c-chart-head"><span class="c-chart-title">${metric.title}构成</span><span class="c-chart-sub">单位：${metric.unit}</span></div>
      <div class="c-chart-body" style="height:166px"><div class="c-baseline"></div><div class="c-bars">${bars}</div></div>
      <div class="c-legend">${legend}</div>
    </div>`;
  }

  function cLineChart(metric) {
    const W = 320, H = 170, padL = 28, padR = 12, padT = 18, padB = 24;
    const n = metric.total.length;
    const x = (i) => padL + (i * (W - padL - padR)) / (n - 1);
    const y = (v) => padT + (1 - v / metric.max) * (H - padT - padB);
    const points = metric.total.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const area = `${padL},${H - padB} ${points} ${x(n - 1).toFixed(1)},${H - padB}`;
    const grid = [0, 0.5, 1].map(t => {
      const gy = padT + t * (H - padT - padB);
      const label = Math.round(metric.max * (1 - t));
      return `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="#f1f5f9" stroke-width="1" />
        <text x="${padL - 5}" y="${gy + 3}" text-anchor="end" font-size="8" fill="#9ca3af">${label}</text>`;
    }).join('');
    const dots = metric.total.map((v, i) => {
      const isLast = i === n - 1;
      return `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${isLast ? 4 : 3}" fill="${isLast ? '#2563eb' : '#fff'}" stroke="#2563eb" stroke-width="1.5" />
        <text x="${x(i).toFixed(1)}" y="${(y(v) - 7).toFixed(1)}" text-anchor="middle" font-size="8" fill="#6b7280">${v}</text>`;
    }).join('');
    const xLabels = metric.days.map((day, i) => `<text x="${x(i).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="8" fill="#9ca3af">${i === n - 1 ? '今天' : day}</text>`).join('');
    return `<div class="c-chart-card">
      <div class="c-chart-head"><span class="c-chart-title">${metric.title}趋势</span><span class="c-chart-sub">单位：${metric.unit}</span></div>
      <div class="c-chart-body">
        <svg class="c-line-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
          <defs><linearGradient id="cLineFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2563eb" stop-opacity=".12"/><stop offset="100%" stop-color="#2563eb" stop-opacity="0"/></linearGradient></defs>
          ${grid}
          <polygon points="${area}" fill="url(#cLineFill)" />
          <polyline points="${points}" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          ${dots}
          ${xLabels}
        </svg>
      </div>
    </div>`;
  }

  function cChart(metric, type) {
    if (type === 'stacked') return cStackedChart(metric);
    if (type === 'line') return cLineChart(metric);
    return cBarChart(metric);

  function defaultDraft(type) {

    if (type === 'sleep') return { durationMin: '', time: NOW, note: '午睡' };
    if (type === 'solid') return { food: '', amount: '', time: NOW, note: '' };

  }

  function navigate(screen) {
    if (!screen) return;
    state.screen = screen;
    state.sheet = null;
    state.draft = null;
    render();
    const params = new URLSearchParams(window.location.search);
    params.set('scenario', state.scenario);
    params.set('screen', state.screen);
    if (state.clean) params.set('clean', '1');
    history.replaceState(null, '', `?${params.toString()}`);
  }

  function openSheet(type, id = null) {
    const editing = id ? state.events.find(e => e.id === id) : null;
    state.sheet = { type, id: id || null };
    state.draft = editing ? { ...editing } : defaultDraft(type);
    render();
  }

  function closeSheet() {
    state.sheet = null;
    state.draft = null;
    render();
  }

  function saveSheet() {
    if (!state.sheet) return;
    const { type, id } = state.sheet;
    const get = (key) => document.getElementById(key)?.value ?? '';
    const time = get('draft-time') || NOW;
    const note = get('draft-note');
    const amountRaw = get('draft-amount');
    const durationRaw = get('draft-duration');
    const food = get('draft-food');
    if (type === 'solid' && !food.trim()) {
      showToast('请填写食物名称');
      return;
    }
    const next = { id: id || Date.now(), type, time, note };
    if (type === 'feed') {
      next.method = state.draft.method;
      next.amount = next.method === 'formula' && amountRaw ? Number(amountRaw) : null;
      next.durationMin = next.method === 'breast' && durationRaw ? Number(durationRaw) : null;
    } else if (type === 'diaper') {
      next.diaperType = state.draft.diaperType;
    } else if (type === 'sleep') {
      next.durationMin = durationRaw ? Number(durationRaw) : null;
      next.note = note || '睡觉';
    } else if (type === 'solid') {
      next.food = food.trim();
      next.amount = amountRaw ? Number(amountRaw) : null;
    }
    if (id) {
      state.events = state.events.map(e => e.id === id ? next : e);
    } else {
      state.events = [...state.events, next];
    }
    state.empty = false;
    state.sheet = null;
    state.draft = null;
    render();
    showToast(id ? '已更新 · 家长记录' : '已记录 · 家长记录');
  }

  function deleteEvent() {
    if (!state.sheet || !state.sheet.id) return;
    state.events = state.events.filter(e => e.id !== state.sheet.id);
    state.sheet = null;
    state.draft = null;
    render();
    showToast('已删除 · 家长记录');
  }

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  function toggleEmpty() {
    state.empty = !state.empty;
    if (state.empty) state.events = [];
    else state.events = DEFAULT_EVENTS.map(e => ({ ...e }));
    render();
    showToast(state.empty ? '已切到空态' : '已恢复样例记录');
  }

  function resetAll() {
    state.events = DEFAULT_EVENTS.map(e => ({ ...e }));
    state.reminder = { enabled: false, interval: 3 };
    state.empty = false;
    state.sheet = null;
    state.draft = null;
    state.statTab = 'feeding';
    render();
    showToast('已重置样例数据');
  }

  function setScenario(scenario) {
    state.scenario = scenario;
    state.screen = scenario === 'A' ? 'a-home' : scenario === 'B' ? 'b-home' : scenario === 'C' ? 'c-today' : 'd-today';
    state.sheet = null;
    state.draft = null;
    render();
    const params = new URLSearchParams(window.location.search);
    params.set('scenario', state.scenario);
    params.set('screen', state.screen);
    if (state.clean) params.set('clean', '1');
    history.replaceState(null, '', `?${params.toString()}`);
  }

  function stepScreen(direction) {
    const list = SCREENS[state.scenario];
    const index = Math.max(0, list.findIndex(s => s.id === state.screen));
    const next = (index + direction + list.length) % list.length;
    navigate(list[next].id);
  }

  screenEl.addEventListener('click', (event) => {
    const target = event.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;
    if (action === 'close-sheet' && event.target.closest('.sheet')) return;
    if (action === 'nav') navigate(target.dataset.screen);
    else if (action === 'back') navigate(BACK[state.screen] || 'a-home');
    else if (action === 'log') openSheet(target.dataset.type);
    else if (action === 'open-event') {
      const id = Number(target.dataset.id);
      const record = state.events.find(e => e.id === id);
      if (record) openSheet(record.type, id);
    } else if (action === 'close-sheet') closeSheet();
    else if (action === 'save-sheet') saveSheet();
    else if (action === 'delete-event') deleteEvent();
    else if (action === 'method') {
      state.draft.method = target.dataset.method;
      render();
    } else if (action === 'diaper-type') {
      state.draft.diaperType = target.dataset.value;
      render();
    } else if (action === 'toggle-reminder') {
      state.reminder.enabled = !state.reminder.enabled;
      render();
      showToast(state.reminder.enabled ? '提醒已开启（原型）' : '提醒已关闭');
    } else if (action === 'set-interval') {
      state.reminder.interval = Number(target.dataset.interval);
      if (!state.reminder.enabled) state.reminder.enabled = true;
      render();
    } else if (action === 'stat-tab') {
      state.statTab = target.dataset.stat;
      render();
    } else if (action === 'chart-metric') {
      state.chartMetric = target.dataset.metric;
      render();
    } else if (action === 'chart-type') {
      state.chartType = target.dataset.chart;
      render();
    } else if (action === 'toggle-empty') toggleEmpty();
    else if (action === 'reset') resetAll();
    else if (action === 'toast') showToast(target.dataset.message || '原型入口');
  });

  screenEl.addEventListener('input', (event) => {
    if (!state.draft) return;
    const id = event.target.id;
    if (id === 'draft-time') state.draft.time = event.target.value;
    if (id === 'draft-note') state.draft.note = event.target.value;
    if (id === 'draft-amount') state.draft.amount = event.target.value;
    if (id === 'draft-duration') state.draft.durationMin = event.target.value;
    if (id === 'draft-food') state.draft.food = event.target.value;
  });

  document.querySelectorAll('.scenario-btn, .floating [data-scenario]').forEach(btn => {
    btn.addEventListener('click', () => setScenario(btn.dataset.scenario));
  });

  document.getElementById('screen-nav').addEventListener('click', (event) => {
    const target = event.target.closest('[data-action]');
    if (!target) return;
    if (target.dataset.action === 'nav') navigate(target.dataset.screen);
    else if (target.dataset.action === 'toggle-empty') toggleEmpty();
    else if (target.dataset.action === 'reset') resetAll();
  });

  document.getElementById('floating').addEventListener('click', (event) => {
    const target = event.target.closest('[data-action]');
    if (!target) return;
    if (target.dataset.action === 'prev-screen') stepScreen(-1);
    if (target.dataset.action === 'next-screen') stepScreen(1);
  });

  document.addEventListener('keydown', (event) => {
    const tag = (event.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || event.target.isContentEditable) return;
    if (event.key === 'ArrowLeft') stepScreen(-1);
    if (event.key === 'ArrowRight') stepScreen(1);
  });

  function initFromQuery() {
    const params = new URLSearchParams(window.location.search);
    state.clean = params.get('clean') === '1';
    const requestedScenario = params.get('scenario');
    state.scenario = requestedScenario === 'B' ? 'B' : requestedScenario === 'C' ? 'C' : requestedScenario === 'D' ? 'D' : 'A';
    const requested = params.get('screen');
    const valid = SCREENS[state.scenario].some(s => s.id === requested);
    state.screen = valid ? requested : (state.scenario === 'A' ? 'a-home' : state.scenario === 'B' ? 'b-home' : state.scenario === 'C' ? 'c-today' : 'd-today');
    if (params.get('empty') === '1') {
      state.empty = true;
      state.events = [];
    }
    if (params.get('reminder') === 'on') state.reminder.enabled = true;
    const stat = params.get('stat');
    if (stat && STAT_DATA[stat]) state.statTab = stat;
    const chartMetric = params.get('chart_metric');
    if (chartMetric && CHART_METRICS[chartMetric]) state.chartMetric = chartMetric;
    const chartType = params.get('chart_type');
    if (['bar', 'stacked', 'line'].includes(chartType)) state.chartType = chartType;
    if (state.clean) {
      document.body.classList.add('clean');
      deviceEl.classList.add('clean');
    }
    render();
    const sheet = params.get('sheet');
    if (sheet && ['feed', 'diaper', 'sleep', 'solid'].includes(sheet)) {
      setTimeout(() => openSheet(sheet), 40);
    }
  }

  initFromQuery();
</script>
</body>
</html>
