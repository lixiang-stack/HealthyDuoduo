services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: healthyduoduo
      POSTGRES_PASSWORD: healthyduoduo # 仅本地开发;全链路默认不出本机(NF-01)
      POSTGRES_DB: healthyduoduo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # hdd 服务以 service_healthy 为启动门(迁移在 hdd 启动时内嵌执行)。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthyduoduo -d healthyduoduo"]
      interval: 5s
      timeout: 3s
      retries: 6
    volumes:
      - pgdata:/var/lib/postgresql/data

  seaweedfs:
    # 对象存储:S3 兼容网关(`server -s3`,默认端口 8333)。
    # 官方 minio/minio 镜像已于 2026-09 从 Docker Hub 撤下(改源码分发),
    # 维护者决策改用 SeaweedFS(ADR-0003);minio-go 客户端作为通用 S3 SDK 保留。
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3
    # 单进程跑 master/volume/filer/S3;重启后 S3 网关需等 raft 收敛,约 15-20 秒才可用
    ports:
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
      - "${S3_API_PORT:-8333}:8333"
    volumes:
      - seaweeddata:/data

  hdd:
    # 数据服务:既有 hdd 二进制的 serve 子命令(常驻 /api/v1,viz-and-client spec)。
    # 识别依赖经 openDeps 就位(HDD_RECOGNIZER_URL 指向栈内 recognizer,HTTP 客户端惰性建连,
    # 不 depends_on);postgres 健康门 + restart 兜底 seaweedfs 首启 raft 收敛期的 fail-fast 重试。
    build:
      context: ..
      dockerfile: deploy/hdd.Dockerfile
    environment:
      HDD_DATABASE_URL: postgres://healthyduoduo:healthyduoduo@postgres:5432/healthyduoduo?sslmode=disable
      HDD_RECOGNIZER_URL: http://recognizer:8000
      HDD_S3_ENDPOINT: http://seaweedfs:8333
      HDD_S3_BUCKET: raw
      HDD_FLAG_POLICY: /app/flag_policy.yaml
    ports:
      - "${HDD_SERVE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  recognizer:
    build:
      context: ..
      dockerfile: deploy/recognizer.Dockerfile
    ports:
      - "${RECOGNIZER_PORT:-8000}:8000"
    # P1 起挂载脱敏样本做调试 CLI 与验收(只读,NF-01)
    volumes:
      - ../samples:/samples:ro

volumes:
  pgdata:
  seaweeddata:
