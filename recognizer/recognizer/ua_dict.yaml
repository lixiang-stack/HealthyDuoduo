# 尿常规词典(P3;ua_01~05 五张真实样本驱动;决策 #8 与 cbc_dict.yaml 头注释一致)。
# 特征:定性结果为主(阴性/3+/norm.,value=None 留痕 raw_text)+ 沉渣计数(个/uL、/HP、/LP)
# 与部分定量项(酸碱度/比重/尿钙/尿肌酐/微白蛋白等)。OCR 损耗形按原样收别名
# (异性红细胞率%、镇检红细胞、粘液铁、结品 等);canonical 是维护者选择的规范名。
# 量纲语义:镜检(/HP)与计数(个/uL)是不同量纲,拆为独立词条;ua_04 打印双段落
# (机器段 无星号 vs 沉渣镜检段 *RBC/*WBC/*EC/*CAST/*BACT),同样拆为独立词条,
# 「(镜检)」后缀 canonical 仅维护者可读。
