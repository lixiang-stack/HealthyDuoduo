    units: ["%"]
  - name: 嗜酸性粒细胞比率
    aliases: [嗜酸性粒细胞比率, 嗜酸细胞百分比, "EO%", "E0%", EOP]
    units: ["%"]
  - name: 嗜碱性粒细胞比率
    aliases: [嗜碱性粒细胞比率, 嗜碱细胞百分比, "BASO%", "BAS0%", BASOP]
    units: ["%"]
  - name: 淋巴细胞数
    aliases: [淋巴细胞数, 淋巴细胞绝对值, "LYMPH#", LYMPHN, LYP]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 中性细胞数
    aliases: [中性细胞数, 中性粒细胞数, 中性粒细胞绝对值, 嗜中性细胞数, NEUT, "NEUT#"]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 单核细胞数
