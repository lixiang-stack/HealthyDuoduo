# 血常规词典(实施计划 P2-1:词典为数据文件,非硬编码;决策 #8:
# 只含「规范名 + 别名/缩写 + 已知单位集」,不内置任何参考值——人群差异内置必错,
# 参考范围一律从检查单抽取)。
#
# 分层:
#   report_type    报告类别(规范名)
#   category       类别识别规则:title_title_keywords 任一命中即认定;否则按
#                  min_matched_items 命中词典项数兜底
#   items          指标项:name=规范名 aliases=别名与缩写 units=已知单位集
#
# units 大小写不敏感比较;OCR 损耗单位(如 109/L、1012/L)不在集合内 →
# 该项 low_confidence=true,供人工核对(报告 ≥partial)。
report_type: 血常规
category:
  title_keywords: ["血常规", "血细胞分析", "血液细胞"]
  min_matched_items: 10
items:
  - name: 白细胞计数
    aliases: [白细胞, 白细胞数, 白细胞计数, WBC]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 红细胞计数
    aliases: [红细胞, 红细胞数, 红细胞计数, RBC]
    units: ["10^12/L", "*10^12/L", "10~12/L", "*10~12/L"]
  - name: 血红蛋白
    aliases: [血红蛋白, HGB, HB]
    units: [g/L]
  - name: 红细胞压积
    aliases: [红细胞压积, 红细胞比容, HCT]
    units: ["%"]
  - name: 红细胞平均体积
    aliases: [红细胞平均体积, MCV]
    units: [fL, fl]
  - name: 平均红细胞血红蛋白量
    aliases: [平均红细胞血红蛋白量, 平均血红蛋白量, MCH]
    units: [pg]
  - name: 平均红细胞血红蛋白浓度
    aliases: [平均红细胞血红蛋白浓度, 平均血红蛋白浓度, MCHC]
    units: [g/L]
  - name: 红细胞分布宽度-CV
    aliases: ["红细胞分布宽度-CV", "红细胞分布宽度(CV)", "RDW-CV"]
    units: ["%"]
  - name: 红细胞分布宽度-SD
    aliases: ["红细胞分布宽度-SD", "红细胞分布宽度(SD)", "RDW-SD"]
    units: ["%"]
  - name: 血小板
    aliases: [血小板, 血小板计数, 血小板数, 血小板总数, PLT]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 血小板压积
    aliases: [血小板压积, 血小板比积, PCT]
    units: ["%"]
  - name: 血小板分布宽度
    aliases: [血小板分布宽度, PDW]
    units: [fL, fl]
  - name: 血小板平均体积
    aliases: [血小板平均体积, MPV]
    units: [fL, fl]
  - name: 大型血小板比率
    aliases: [大型血小板比率, 大血小板比率, P-LCR]
    units: ["%"]
  - name: 淋巴细胞比率
    aliases: [淋巴细胞比率, 淋巴细胞百分比, "LYMP%", LYMPHP]
    units: ["%"]
  - name: 中性细胞比率
    aliases: [中性细胞比率, 中性粒细胞比率, 中性粒细胞百分比, 嗜中性细胞比率, "NEUT%", NEUTP]
    units: ["%"]
  - name: 单核细胞比率
