# 血常规词典(实施计划 P2-1:词典为数据文件,非硬编码;决策 #8:
# 只含「规范名 + 别名/缩写 + 已知单位集」,不内置任何参考值——人群差异内置必错,
# 参考范围一律从检查单抽取)。
#
# 【历史的根因与避免措施】本词典最初由人工构造(凭记忆/医学常识),在本需求推进中多次出错:
#   * 规范名与单据印法颠倒(红细胞平均体积 ← 实际印法 平均红细胞体积);
#   * 挂了语料里从未出现的别名(白细胞数/HB/超敏C反应蛋白/BAS0# 等);
#   * 单位集标错(RDW-SD 印 fL 却只登记 %)。
# 避免措施(此后每次改词典强制执行):
#   1. 词条必须以 samples/expected/ocr/ 中真实 OCR 文本为证据;observed 而非构造;
#   2. tests/test_dict_coverage.py 是自动门禁:别名无证据即红;
#   3. canonical(规范名)是面向报告的维护者选择,可与单据印法不同,但允许别名携带单据印法;
#   4. 改完词典重跑 `python -m recognizer.golden`,人工核对 raw_text 后再冻结 golden。
#
# 分层:
#   report_type    报告类别(规范名)
#   category       类别识别规则:title_title_keywords 任一命中即认定;否则按
#                  min_matched_items 命中词典项数兜底
#   items          指标项:name=规范名 aliases=别名与缩写 units=已知单位集
#
# units 为维护者核对用的已知单位字面量(大小写不敏感比较;匹配语义);
# 印刷后的展示归一见 recognizer/unit_conversions.yaml / ocr_forms.yaml(损耗形如
# 109/L、7/6.0 经项注册集裁决收敛到规范印形;未注册印形保留原文,详见 postprocess)。
report_type: 临检
category:
  title_keywords: ["血常规", "血细胞分析", "血液细胞"]
  min_matched_items: 10
  # 依据: 2025 成人健康体检指引;2022 健康体检基本项目专家共识;WS/T 405—2012;
  #       WS/T 779—2021(儿童);WS/T 406—2024;LOINC 57021-8;
  #       血沉 / CRP / 超敏CRP / SAA 为炎症标志物,随本词典归血常规(产品决定)
  panel: cbc
