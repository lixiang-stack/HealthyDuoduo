    aliases: [嗜酸性粒细胞数, 嗜酸细胞绝对值, "EO#", "E0#", EON]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 嗜碱性粒细胞数
    aliases: [嗜碱性粒细胞数, 嗜碱细胞绝对值, "BASO#", "BAS0#", BASON]
