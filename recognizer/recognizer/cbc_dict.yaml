# 血常规词典(实施计划 P2-1:词典为数据文件,非硬编码;决策 #8:
# 只含「规范名 + 别名/缩写 + 已知单位集」,不内置任何参考值——人群差异内置必错,
# 参考范围一律从检查单抽取)。
#
# 【历史的根因与避免措施】本词典最初由人工构造(凭记忆/医学常识),在本需求推进中多次出错:
#   * 规范名与单据印法颠倒(红细胞平均体积 ← 实际印法 平均红细胞体积);
#   * 挂了语料里从未出现的别名(白细胞数/HB/超敏C反应蛋白/BAS0# 等);
#   * 单位集标错(RDW-SD 印 fL 却只登记 %)。
# 避免措施(此后每次改词典强制执行):
#   1. 词条必须以 samples/expected/ocr/ 中真实 OCR 文本为证据;observed 而非构造;
#   2. tests/test_dict_coverage.py 是自动门禁:别名无证据即红;
#   3. canonical(规范名)是面向报告的维护者选择,可与单据印法不同,但允许别名携带单据印法;
#   4. 改完词典重跑 `python -m recognizer.golden`,人工核对 raw_text 后再冻结 golden。
#
# 分层:
#   report_type    报告类别(规范名)
#   category       类别识别规则:title_title_keywords 任一命中即认定;否则按
#                  min_matched_items 命中词典项数兜底
#   items          指标项:name=规范名 aliases=别名与缩写 units=已知单位集
#
# units 为维护者核对用的已知单位字面量(大小写不敏感比较;匹配语义);
# 印刷后的展示归一见 recognizer/unit_families.yaml(损耗形如 109/L、7/6.0
# 经项注册集裁决收敛到规范印形;未注册印形保留原文,详见 postprocess)。
report_type: 临检
category:
  title_keywords: ["血常规", "血细胞分析", "血液细胞"]
  min_matched_items: 10
  # 依据: 2025 成人健康体检指引;2022 健康体检基本项目专家共识;WS/T 405—2012;
  #       WS/T 779—2021(儿童);WS/T 406—2024;LOINC 57021-8;
  #       血沉 / CRP / 超敏CRP / SAA 为炎症标志物,随本词典归血常规(产品决定)
  panel: cbc
items:
  - name: 白细胞计数
    aliases: [白细胞, WBC, 白细胞数目, 白细胞总数]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 红细胞计数
    aliases: [红细胞, RBC, 红细胞数目]
    units: ["10^12/L", "*10^12/L", "10~12/L", "*10~12/L"]
  - name: 血红蛋白
    aliases: [HGB, 血红蛋白浓度, 血红蛋白量]
    units: [g/L]
  - name: 红细胞压积
    aliases: [HCT, 红细胞比积]
    units: ["%"]
  - name: 平均红细胞体积
    aliases: [红细胞平均体积, MCV]
    units: [fL, fl]
  - name: 平均红细胞血红蛋白量
    aliases: [平均血红蛋白量, MCH, 平均红细胞血红蛋白含量, 平均血红蛋白含量]
    units: [pg]
  - name: 平均红细胞血红蛋白浓度
    aliases: [平均血红蛋白浓度, MCHC]
    units: [g/L]
  - name: 红细胞分布宽度-CV
    aliases: ["红细胞分布宽度-CV", "红细胞分布宽度(CV)", "RDW-CV", 红细胞分布宽度变异系数, 红细胞分布宽度CV]
    units: ["%"]
  - name: 红细胞分布宽度-SD
    aliases: ["红细胞分布宽度-SD", "红细胞分布宽度(SD)", "RDW-SD", 红细胞分布宽度标准差]
    units: [fL, fl]
  - name: 血小板
    aliases: [血小板总数, PLT, 血小板数目, 血小板计数]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 血小板比积
    aliases: [血小板压积, PCT]
    units: ["%"]
  - name: 血小板分布宽度
    aliases: [PDW]
    units: [fL, fl]
  - name: 血小板平均体积
    aliases: [MPV, 平均血小板体积]
    units: [fL, fl]
  - name: 大型血小板比率
    aliases: [大血小板比率, P-LCR, 大型血小板比]
    units: ["%"]
  - name: 大血小板数目
    aliases: [P-LCC]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 淋巴细胞比率
    aliases: [淋巴细胞百分比, "LYMP%", "LYMPH%", LYMPHP, "Ly%", 淋巴细胞比值]
    units: ["%"]
  - name: 中性细胞比率
    aliases: [中性粒细胞百分比, 嗜中性细胞比率, "NEUT%", NEUTP, "Neu%", 中性粒细胞比值]
    units: ["%"]
  - name: 单核细胞比率
    aliases: [单核细胞百分比, "MONO%", MONOP, "Mon%", 单核细胞比值]
    units: ["%"]
  - name: 嗜酸性粒细胞比率
    aliases: [嗜酸细胞百分比, "EO%", "E0%", EOP, "Eos%", 嗜酸性粒细胞比值]
    units: ["%"]
  - name: 嗜碱性粒细胞比率
    aliases: [嗜碱细胞百分比, "BASO%", "BAS0%", BASOP, "Bas%", 嗜碱性粒细胞比值]
    units: ["%"]
  - name: 淋巴细胞数
    aliases: [淋巴细胞绝对值, "LYMPH#", LYMPHN, LYP, "Lym#", 淋巴细胞数目, 淋巴细胞计数]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 中性细胞数
  # canonical 取单据印出的「中性细胞+数」;别名含 cbc_04 印法「嗜中性细胞数」
    aliases: [嗜中性细胞数, NEUT, "NEUT#", "Neu#", 中性粒细胞数目, 中性粒细胞绝对值, 中性粒细胞计数]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 单核细胞数
    aliases: [单核细胞绝对值, "MONO#", MONON, "Mon#", 单核细胞数目, 单核细胞计数]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 嗜酸性粒细胞数
    aliases: [嗜酸细胞绝对值, "EO#", "E0#", EON, "Eos#", 嗜酸性粒细胞数目, 嗜酸性粒细胞计数]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 嗜碱性粒细胞数
    aliases: [嗜碱细胞绝对值, "BASO#", BASON, "BAS0:", "Bas#", 嗜碱性粒细胞数目, 嗜碱性粒细胞计数]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 有核红细胞百分比
    aliases: ["NRBC%"]
    units: ["%"]
  - name: 有核红细胞绝对值
    aliases: ["NRBC#"]
    units: ["10^9/L", "*10^9/L", "10~9/L", "*10~9/L"]
  - name: 血沉
    aliases: [ESR]
    units: [mm/h]
  - name: C反应蛋白
    aliases: [CRP]
    units: [mg/L]
  - name: 超敏C反应蛋白
    aliases: []
    units: [mg/L]
  - name: 血清淀粉样蛋白A
    aliases: [SAA]
    units: [mg/L]
