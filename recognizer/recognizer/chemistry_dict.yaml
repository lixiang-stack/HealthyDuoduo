# ==== glu_dict.yaml(原 血糖;min=2;titles=['葡萄糖测定', '葡萄糖耐量', '糖耐量', '糖化血红蛋白']) ====
  - name: 空腹葡萄糖
    panel: glucose
    aliases: [GLUO, HR葡萄糖, 糖耐量-空腹血糖, FPG]
    units: [mmol/L, unol/1, mnol/L, mmo1/L, mol/L]
  - name: 餐后半小时葡萄糖
    panel: glucose
    aliases: [GLU1/2]
    units: [mmol/L, mnol/L, mmo1/L, mol/L]
  - name: 餐后一小时葡萄糖
    panel: glucose
    aliases: [GLUI, 1hPG]
    units: [mmol/L, mnol/L, mmo1/L, mol/L]
  - name: 餐后二小时葡萄糖
    panel: glucose
    aliases: [GLU2, 餐后2h血糖, GLU2h, 2hPG]
    units: [mmol/L, mmo1/L]
  - name: 餐后三小时葡萄糖
    panel: glucose
    aliases: [GLU3]
    units: [mmol/L, mol/L]
  - name: 糖化血红蛋白
    panel: glucose
    aliases: [糖化血红蛋白HbA1C, HbA1C, GHB]
    units: ["%"]
  - name: C肽
    panel: glucose
    aliases: [C_P, C_肽]
    units: [ng/mL]
  - name: 胰岛素
    panel: glucose
    aliases: [IRI]
    units: [uIU/mL]

