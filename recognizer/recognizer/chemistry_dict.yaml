# 生化词典(2026-10 分组方案:物理合并 lft_dict.yaml + glu_dict.yaml + vitanemia_dict.yaml。
# 临检组为 logical merge、不适用本文件。report_type 输出为 生化
# (原 肝肾功能/血糖/维生素与贫血);min_matched_items 取各源最小值。
# 条目体逐字来自源文件,条目注释与决策 #8 头注释随之搬运,分节 banner 留来源元信息。
#
# panel 依据(逐项见 item.panel;依据 spec §5.5.3;不重排既有条目):
#   liver: 2025 成人健康体检指引;2022 健康体检基本项目专家共识;WS/T 404.1/2/4;
#          WS/T 780—2021(儿童);WS/T 645.2—2026(AFP 随报告归肝功,产品偏离)
#   kidney: 2025 成人健康体检指引;2022 共识;WS/T 404.5;WS/T 780—2021(儿童)
#   lipid: 2025 成人健康体检指引;2022 共识;中国血脂管理指南(2023年);LOINC 57698-3
#   glucose: 2025 成人健康体检指引;2022 共识;中国2型糖尿病防治指南(2020年版);WS/T 461—2024
#   uric_acid: 2025 成人健康体检指引(血尿酸单列);2022 共识;2013 医疗机构临床检验项目目录
#   electrolyte: WS/T 404.3/404.6;WS/T 780—2021(儿童);2013 目录
#   vitanemia: 儿童铁缺乏和缺铁性贫血防治专家共识(2023);WS/T 478—2024;2013 目录
#   other: 无明确依据的兜底(本词典未使用)

