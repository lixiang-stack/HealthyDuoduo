# 免疫词典(2026-10 分组方案:物理合并 ana_dict.yaml + infectious_dict.yaml + fibrosis_dict.yaml。
# 临检组为 logical merge、不适用本文件。report_type 输出为 免疫
# (原 自身抗体/传染病/肝纤维化);min_matched_items 取各源最小值。
# 条目体逐字来自源文件,条目注释与决策 #8 头注释随之搬运,分节 banner 留来源元信息。
#
# panel 依据(逐项见 item.panel;依据 spec §5.5.3):
#   infection: 医疗机构临床检验项目目录(2013年版);慢性乙型肝炎防治指南(2022年版);
#              丙肝/梅毒/HIV 项目见 2013 目录
#   autoimmune: 2013 目录;自身免疫性肝炎诊断和治疗指南(2021);ENA/ANCA 项目见 2013 目录
#   other: 肝纤维化四项首版不拆独立项目组(产品决定);无明确依据时兜底

report_type: 免疫
category:
  title_keywords: [抗核抗体, 自免肝, 自身抗体, 术前八项, 乙肝, 肝炎, 肝纤维化]
  min_matched_items: 2
  panel: other
items:

