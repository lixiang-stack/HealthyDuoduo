# 激素词典(2026-10 分组方案:物理合并 tft_dict.yaml + proghcg_dict.yaml。
# 临检组为 logical merge、不适用本文件。report_type 输出为 激素
# (原 甲状腺功能/孕酮与HCG);min_matched_items 取各源最小值。
# 条目体逐字来自源文件,条目注释与决策 #8 头注释随之搬运,分节 banner 留来源元信息。

report_type: 激素
category:
  title_keywords: [甲状腺, 甲功, HCG（检验）, P（检验）]
  min_matched_items: 1
items:

# ==== tft_dict.yaml(原 甲状腺功能;min=4;titles=['甲状腺', '甲功']) ====
  - name: 促甲状腺素
    aliases: [高敏促甲状腺激素(sTSH), TSH]
    units: [mIU/L, uIU/ml]
  - name: 甲状腺球蛋白
    aliases: [TG]
    units: [ng/ml, ng/al]
  - name: 三碘甲状腺原氨酸
    aliases: [总三碘甲状腺原氨酸, T3, TT3]
    units: [nmol/L, mmol/L, ng/ml, ng/d1]
  - name: 甲状腺素
    aliases: [总甲状腺素, T4, T74]
    units: [nmol/L, rmol/L, ng/ml]
  - name: 游离三碘甲状腺原氨酸
    aliases: [游离T3, FT3, 游离三碘甲状腺原氨酸(FT3), 淤离三碘甲状腺原氨酸FT3]
    units: [pmol/L, pg/al]
  - name: 游离甲状腺素
    aliases: [游离T4, FT4, 游离甲状腺素(FT4), F74]
    units: [pmol/L, pmo1/L, ng/d1, pg/al]
  - name: 抗甲状腺过氧化物酶抗体
    aliases: [甲状腺过氧化物酶抗体(TPOAb), TPOAb]
    units: [IU/mL, IU/al, 1U/mL, U/ml]
  - name: 抗甲状腺球蛋白抗体
    aliases: [抗甲状腺球蛋白抗体(Tg-Ab), TG-Ab, TGAb]
    units: [IU/mL, 1U/mL, U/ml]
  - name: 抗促甲状腺素受体抗体
    aliases: [抗促甲状腺素受体抗体(TRAb), 促甲状腺激素受体抗体, ATSHR]
    units: [IU/L]

# ==== proghcg_dict.yaml(原 孕酮与HCG;min=1;titles=['HCG（检验）', 'P（检验）']) ====
  - name: 孕酮
    aliases: []
    units: [ng/mL]
  - name: 人绒毛膜促性腺激素及β亚单位
    aliases: [人绒毛膜促性腺激, 素及β亚单位, "HCG+ β HCG"]
    units: [mIU/ml]
