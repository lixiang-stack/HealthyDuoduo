# 激素词典(2026-10 分组方案:物理合并 tft_dict.yaml + proghcg_dict.yaml。
# 临检组为 logical merge、不适用本文件。report_type 输出为 激素
# (原 甲状腺功能/孕酮与HCG);min_matched_items 取各源最小值。
# 条目体逐字来自源文件,条目注释与决策 #8 头注释随之搬运,分节 banner 留来源元信息。
#
# panel 依据(逐项见 item.panel;依据 spec §5.5.3):
#   thyroid: 2025 成人健康体检指引(TSH/FT4 为基本项目);WS/T 404.10—2022;
#            中国甲状腺功能亢进症和其他原因所致甲状腺毒症诊治指南(2022)
#   sex_hormone: 中枢性性早熟诊断与治疗专家共识(2022);性早熟诊疗指南(试行);
#                医疗机构临床检验项目目录(2013年版)
#   other: 无明确依据的兜底(本词典未使用)

report_type: 激素
category:
  title_keywords: [甲状腺, 甲功, HCG（检验）, P（检验）]
  min_matched_items: 1
  panel: other
items:

