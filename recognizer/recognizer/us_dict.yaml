# 超声词典(2026-10 分组方案:logical merge——本文件是 影像 大类的超声子词典;
# 其他影像模态(CT/MRI 等)按真实样本新增文件,共用 report_type: 影像)。
# 叙述体(category.mode=narrative):无表头/行列,关键指标以「别名 + 桥接符 + 数值」
# 形态散布于检查所见文字行(_extract_narrative 行内配对;值不完整/未提及 → value=None,
# raw_text 留整行供人工核对)。OCR 损耗行不命中即漏抓,报告保 partial 诚实留痕;
# canonical 是维护者选择的规范名。当前 items 仅覆盖产检超声测量项,非产科超声按样本续录。

report_type: 影像
category:
  title_keywords: [超声, 彩超]
  min_matched_items: 3
  mode: narrative
  section_anchors:
