# 其他专项词典(产前筛查)。
# 版式:筛查项目名(母龄风险/开放性神经管缺陷/18-三体综合征/唐氏综合征)在表头行
# (项目名称/风险计算结果)下方独立成列,不满足 3 角色词的表头带判定,故走 narrative
# 模式逐格收录。名称右侧同行的风险比值(1:270)与 MoM/年龄值由 postprocess
# 的 narrative 右侧同行回退吸收;仍找不到 value 的项留痕 raw_text,人工核对。
# 其他专项(Special)按需扩展:无创DNA/基因检测/微生物等继续在此文件收录。
