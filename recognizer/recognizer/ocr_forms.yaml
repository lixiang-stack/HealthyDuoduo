# OCR 字形修复表(只做印形修复;postprocess.load_unit_forms 合并加载)。
#
# 【为什么存在】上标印形(10^9/L)与低分辨率源图(600px 微信截图/手机拍照件)令 OCR
# 读出一批不可比单位字面(109/L、7/6.0、1/6.0…);词典 units 的多印形注册解决
# 「匹配」,不解决「展示一致」:同一指标项跨单印形不同 → hdd trend 的 sameUnit
# 判不等,delta 全 "-",时序不可比。本表把同一物理单位的全部已知 OCR/印刷损耗形
# 收敛到唯一规范印形(canonical),在 postprocess 落报告时替换 unit 字段。
#
# 【边界】本表只收 OCR/印刷损耗形(上标拍平、l→1、m→n、斜杠丢失、空格/装饰符等)。
# 真实单位及其等价写法在 unit_conversions.yaml;真实单位不得作为本表的 form,
# 同一单位字面不得同时出现在两张表(loader 强制)。
#
# 【证据规则】与 *_dict.yaml 同源,每条 form 须有真实语料证据
# (samples/expected/ocr 或 data/masked/ocr,行尾 [样本 id] 注明)或已由词典
# units 登记背书;证据不足或映射链可疑的不收录(rmol/L、ag/L、ng/al、10/a1、
# IU/al 等保留原文,列在 docs/design/2026-10-12-unit-normalization.md)。
#
# 【语义】canonical = 报告 unit 字段的唯一印形;forms = 同族 OCR/印刷损耗形
# (匹配小写、大小写不敏感;同 form 可属多族,归一时由该项注册集裁决唯一生效者,
# 见 postprocess._normalize_unit:仅当该项 units 已注册 canonical 才替换)。
families:
  - canonical: "10^9/L"
    forms:
      - "*10^9/L"     # [webwxgetmsgimg_19, cbc_08]
      - "10~9/L"      # [cbc_02, cbc_06, webwxgetmsgimg_9/19/20]
      - "*10~9/L"     # [cbc_03, webwxgetmsgimg_19]
      - "109/L"       # 上标 9 拍平 [cbc_01, cbc_04, cbc_07, cbc_09, webwxgetmsgimg_10/20]
      - "7/6.0"       # [cbc_05 微信 600px 截图]
      - "7/6.01"      # [cbc_05]
      - "1/6.0"       # [cbc_04 拍照件, cbc_05]
      - "1/6.01"      # [cbc_05]
      - "T/6.01"      # [cbc_07 单核细胞数]
      - "1/00.91"     # [cbc_09 血小板]
      - "*10"         # [cbc_08 血小板/有核红细胞绝对值]
      - ".09/L"       # [cbc_05 淋巴细胞数 熔断尾片]
      - "~9/L"        # [cbc_02, cbc_05 熔断格尾]
      - "f1"          # [cbc_05 嗜碱粒细胞数;l→1 形,仅对 10^9 注册项生效]
  - canonical: "10^12/L"
    forms:
      - "*10^12/L"    # [cbc_08, webwxgetmsgimg_19]
      - "*10~12/L"    # [cbc_02, cbc_03, cbc_07]
      - "10~12/L"     # [cbc_02, cbc_03, cbc_07, webwxgetmsgimg_10]
      - "1012/L"      # 上标拍平 [cbc_01]
      - ")12/L"       # [cbc_05 尾片]
  - canonical: "μmol/L"
    forms:
      - "μ mol/L"     # [lft_01, lft_08, webwxgetmsgimg_11]
      - "μmol L"      # 斜杠漏识为空格 [lft_08 肌酐]
      - "μmo1/L"      # [lft_03, lft_05]
      - "μnol/L"      # [lft_03]
      - "μno1/L"      # [lft_03]
  - canonical: "ng/ml"
    forms:
      - "ng/m1"       # l→1 [vitanemia_02]
      - "ng/al"       # [tft_01 甲状腺球蛋白]
  - canonical: "fL"
    forms:
      - "f1"          # l→1 [cbc_05 MPV/红细胞平均体积]
  - canonical: "pmol/L"
    forms:
      - "pmo1/L"      # [tft_01 游离甲状腺素]
  - canonical: "nmol/L"
    forms:
      - "rmol/L"      # [tft_01 甲状腺素]
  - canonical: "mg/L"
    forms:
      - "ag/L"        # [cbc_05 C反应蛋白]
  - canonical: "pg/mL"
    forms:
      - "pg/al"       # [tft_03 游离三碘甲状腺原氨酸]
  - canonical: "ng/dL"
    forms:
      - "ng/d1"       # [tft_03 游离甲状腺素]
  - canonical: "ug/dL"
    forms:
      - "ug/d1"       # [tft_03 甲状腺素]
  - canonical: "IU/mL"
    forms:
      - "IU/al"       # [tft_01 抗甲状腺过氧化物酶抗体]
      - "10/a1"       # [tft_01 抗甲状腺球蛋白抗体]
      - "1U/mL"       # [tft_02 抗甲状腺球蛋白抗体;l→1]
  - canonical: "%"
    forms:
      - "t"           # [cbc_09 中性细胞比率;单字符印形由项注册集裁决]
  - canonical: "mmol/L"
    forms:
      - "mnol/L"      # [glu_02 餐后半小时]
      - "mmo1/L"      # [glu_02 餐后二小时]
      - "unol/1"      # [glu_02 空腹]
      - "t"           # [glu_01 餐后二小时;与 % 同形,由项注册集裁决]
