[project]
name = "recognizer"
version = "0.1.0"
description = "HealthyDuoduo recognizer service: OCR (RapidOCR) + rule-based post-processing (ADR-0002)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "rapidocr>=3.9.0",
    "onnxruntime>=1.30.0",
    # 预处理开关(P3)直接 import 的图像栈;原先仅作为 rapidocr 传递依赖存在
    "numpy>=1.26",
    "pillow>=10.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonschema>=4.23",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recognizer"]
