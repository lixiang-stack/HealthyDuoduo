[project]
name = "recognizer"
version = "0.1.0"
description = "HealthyDuoduo recognizer service: OCR (RapidOCR) + rule-based post-processing (ADR-0002)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonschema>=4.23",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recognizer"]
