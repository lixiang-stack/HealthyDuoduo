# 数据服务 HTTP 契约唯一源(OpenAPI 3.1 单文件;viz-and-client spec「契约与 API 面」)。
# M0 冻结(票 02):12 端点全形状一次定稿——成员(显示名+是否孩子)、报告(归属可空+fail_reason)、
# 指标项(item_id 不透明句柄+核对状态+ocr_lines 行号与框坐标+prev B2-lite)、修正对表形状、
# trend 单位门控。识别端既有 JSON Schema(schemas/*.schema.json) 与 pydantic/Go 互证、
# 存量识别 golden 完全不动;HTTP 指标项字段与识别端 reportItem 同源,由互证测试
# (internal/httpapi)锁死逐字段子树相等——reportItem additionalProperties:false 冻结,
# 无法 allOf 扩展,故 HTTP 侧镜像而非 $ref(见 ReportItem 描述)。
# App 侧 codegen 生成的 TS 类型以本文件为准;HTTP fixtures(schemas/testdata/http)为 golden。
openapi: 3.1.0
info:
  title: HealthyDuoduo Data Service API
  version: 0.1.0
  description: |
    家长 App 的后端数据服务(既有 hdd 二进制的 serve 子命令,复用 openDeps 编排依赖层)。
    局域网先行、不做鉴权(ADR-0006);所有路径挂在 /api/v1 前缀下(见 servers)。
# 前缀经 servers 表达:路径键保持无前缀,部署方换 IP/端口不碰契约;
# 与设计文档 6 的「GET /api/v1/health」按 servers + paths 拼接读法对应。
servers:
  - url: /api/v1
    description: 数据服务前缀(路由器 DHCP 保留 IP + 固定端口下的路径基座)
paths:
  /health:
    get:
      operationId: getHealth
      summary: 配对后连通性校验
      description: 进程级存活与版本;依赖未就绪时服务不启动(fail-fast),故应答即健康。
      responses:
        "200":
          description: 服务存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /members:
    get:
      operationId: listMembers
      summary: 成员列表(B1)
      description: 家庭档案入口;列表按 member_id 升序(创建序)返回。
      responses:
        "200":
          description: 全部成员
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersList"
    post:
      operationId: createMember
      summary: 建成员
      description: name/sex/birth_date 必填;is_child 由出生日期自动计算;member_id/created_at 服务端产生。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberCreate"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
  /members/{member_id}:
    patch:
      operationId: updateMember
      summary: 改名 / 改性别 / 改出生日期
      description: 至少一项;删除成员见 DELETE。
      parameters:
        - $ref: "#/components/parameters/MemberID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteMember
      summary: 删除成员
      description: |
        硬删成员及其全部报告(报告/指标项/修正对级联;原始图像与 OCR 历史保留)。
        不可恢复。成员不存在返回 404。
      parameters:
        - $ref: "#/components/parameters/MemberID"
      responses:
        "204":
          description: 已删除
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{member_id}/growth:
    get:
      operationId: listGrowth
      summary: 生长记录列表
      description: |
        按测量日期降序(同日按记录 id 降序)返回该成员全部生长记录。
        BMI 由测量时点的身高体重实时计算,不缓存;weight_status 为超重 / 肥胖判定,
        百分位规则落地前为 null。
      parameters:
        - $ref: "#/components/parameters/MemberID"
      responses:
        "200":
          description: 生长记录列表(空数组而非 null)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createGrowth
      summary: 新增生长记录
      description: |
        每次测量一行:measured_on 与 source 必填,height_cm / weight_kg 至少一项。
        来源只记录实测 / 体检单,用于区分测量值可信度。
      parameters:
        - $ref: "#/components/parameters/MemberID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrowthRecordCreate"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /reports:
    get:
      operationId: listReports
      summary: 报告时间线(按成员过滤)
      description: |
        member_id 缺省 = 全部报告(含存量无主)。每张卡片含状态、未核对低置信计数
        (响应派生,见 ReportSummary)与按 flag 异常计数徽标口径。
      parameters:
        - name: member_id
          in: query
          description: 过滤归属成员;缺省返回全部成员与无主存量报告
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 时间线卡片列表(排序客户端做:dateless 沉底不受排序破坏)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsList"
    post:
      operationId: createReport
      summary: 上传检查单(multipart:图像 + 成员)
      description: |
        multipart 原子接收(无分片、无断点续传),同步等待识别,响应即完整报告(NF-04 <3s)。
        图像内容 sha256 幂等:命中已有报告按 status 回分岔矩阵——
        · 已有报告不含核对决策 → 200 + duplicate:true(离线队列重试安全);
        · 已含核对决策(任一指标项 review_status ≠ unreviewed)→ 409:
          已确信的数字不被同图重传悄悄覆盖/重跑(离线队列不重传已归档件,不踩此分支);
          显式覆盖才放行:multipart override=true 重跑识别并重置归档,
          指标项 item_id 全部更换、review_status 全部回 unreviewed(单向派生的显式豁免)。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [image, member_id]
              properties:
                image:
                  type: string
                  format: binary
                  description: 一张检查单的数字图像(单图,对应一张检查单)
                member_id:
                  type: integer
                  format: int64
                  description: 归属成员
                override:
                  type: boolean
                  default: false
                  description: 显式覆盖:同图命中且已有报告含核对决策时重跑识别的唯一入口
      responses:
        "200":
          description: sha 命中已有报告(幂等,duplicate:true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "201":
          description: 新报告归档(或显式 override 重跑后归档)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 同图命中但已有报告含核对决策(detail 见 operation 描述)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reports/{report_id}:
    get:
      operationId: getReport
      summary: 报告详情
      description: |
        指标项含稳定外部句柄 item_id、核对状态、OCR 行链接与 B2-lite 上一值。
        报告状态派生单调:failed / success 恒定;partial → success 当且仅当
        unreviewed_low_confidence_count = 0,单向永不回退;无「撤销回未核对」。
      parameters:
        - $ref: "#/components/parameters/ReportID"
      responses:
        "200":
          description: 完整报告
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: reassignReport
      summary: 改归属
      description: 传错成员不必删档重传;硬删之外的全部字段不变。
      parameters:
        - $ref: "#/components/parameters/ReportID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [member_id]
              properties:
                member_id:
                  type: integer
                  format: int64
                  description: 目标成员
      responses:
        "200":
          description: 已改派(返回刷新后的报告头部)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteReport
      summary: 删除报告
      description: |
        硬删报告与指标项与修正对(级联);原始图像与 OCR 识别历史留痕保留,
        同图日后可重新上传入档(下上传回 201 新报告,内容哈希不再命中)。无回收站。
      parameters:
        - $ref: "#/components/parameters/ReportID"
      responses:
        "204":
          description: 已删除
        "404":
          $ref: "#/components/responses/NotFound"
  /reports/{report_id}/items/{item_id}:
    patch:
      operationId: reviewItem
      summary: 核对(确认 / 修正)
      description: |
        家长逐项确信的落库动作:确认(认可解析结果,不产生记录)或修正
        (改 value/unit/name/ref_range 四个纸面事实)。flag 由服务端按修正后的
        value × ref_range 重算,契约无手改入口。决策可重复(已确认可再修正、已修正
        可再修正/再确认),每次修正 append 一条修正对;响应返回报告级状态与
        未核对低置信计数(单响应刷新整屏)。任意指标项均可发起(高置信亦然)。
      parameters:
        - $ref: "#/components/parameters/ReportID"
        - $ref: "#/components/parameters/ItemID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: 已落库(report_items 装最终生效值;partial → success 单向派生)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /images/{sha256}:
    get:
      operationId: getImage
      summary: 图像(后端代理对象存储)
      parameters:
        - name: sha256
          in: path
          required: true
          description: 图像内容 sha256(64 hex)
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: 图像字节流(局域网直出)
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{member_id}/indicators/{name}/trend:
    get:
      operationId: getTrend
      summary: B2 趋势时序(单位门控)
      description: |
        同成员下指定指标项的跨报告时序点,按趋势键(code 优先,缺失用 loinc,
        再回退词典规范名)连接,可跨面板;按 report_date 升序;日期为 null 的点排
        最后且不参与连线。unit 门控:?unit= 指定 canonical unit → 只返回同单位点;
        缺省返回全部 canonical unit 的点(跨单位族不连线不提示;不存在运行时换算与
        换算系数表)。unit_status=unverified 的点默认不返回。本端点 M4 消费、M0 冻结。
      parameters:
        - $ref: "#/components/parameters/MemberID"
        - $ref: "#/components/parameters/IndicatorName"
        - name: unit
          in: query
          description: 门控 canonical unit(如 g/L);缺省 = 全部 canonical unit 的点
          schema: { type: string }
      responses:
        "200":
          description: 时序点列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{member_id}/panels:
    get:
      operationId: listMemberPanels
      summary: 项目列表(按成员)
      description: |
        当前成员非 failed 报告的项目组聚合;只返回 report_count > 0 的项目,没有
        可归类报告时返回空数组。排序:最近报告日期降序(dateless 沉底),同日期按
        固定项目组优先级。failed 报告不参与;未回填存量(panels=[])一律归 other,
        与 App `?panel=` 筛选回退口径一致。
      parameters:
        - $ref: "#/components/parameters/MemberID"
      responses:
        "200":
          description: 项目列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelsList"
        "404":
          $ref: "#/components/responses/NotFound"
  /members/{member_id}/panels/{panel}:
    get:
      operationId: getPanelDetail
      summary: 项目详情(按成员 + 项目组)
      description: |
        该项目组下全部指标的最新值与跨报告趋势,按趋势键(code 优先,缺失用 loinc,
        再回退词典规范名)+ canonical unit 分行(跨单位不合并、不换算);同一分析物
        跨面板连接。异常项在前,其余按最新报告内指标顺序;latest 为空且
        not_tested_count > 0 表示「未检测」;latest_report_not_tested 表示最近一份
        含该指标的报告中此项未检测,数值是最近一次已知值。narrative=true(影像)
        时 items=[]。未知成员 404,非法 panel 400。
      parameters:
        - $ref: "#/components/parameters/MemberID"
        - $ref: "#/components/parameters/Panel"
      responses:
        "200":
          description: 项目详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /analyses:
    post:
      operationId: createAnalysis
      summary: 创建分析(事实层)
      description: |
        家长从项目详情页 / 单指标 / 病历进入分析。事实层永远输出:纳入范围、偏离项、
        与本人历史比较、相关病历诊断与处理原文、未纳入项及原因。窗口默认最近 12 个月,
        每趋势键最多 6 个有效点;稀疏时扩展至 24 个月 / 最多 4 个点并标注「历史数据较少」。
        单指标入口自动扩展至所属 Panel,并在 facts.expanded_from_indicator 提示范围。
        影像 / 叙述型 Panel 不进入分析(clinical_note 入口除外)。
        本次分析永久保存快照(成员、Panel、窗口、有效点集合、病历引用、规则版本)。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
      responses:
        "201":
          description: 已创建(含事实层、快照、来源与配额)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /analyses/metrics:
    get:
      operationId: getAnalysisMetrics
      summary: 周检指标
      description: |
        返回指定日期区间的分析数、反馈数与降级事件数,用于每周计算反馈率与降级率。
        from / to 缺省为最近 7 天(含当天);日期格式 YYYY-MM-DD。
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        - name: to
          in: query
          required: false
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
      responses:
        "200":
          description: 区间指标
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisMetrics"
        "400":
          $ref: "#/components/responses/BadRequest"
  /analyses/{analysis_id}/feedback:
    post:
      operationId: createAnalysisFeedback
      summary: 记录「这不对」反馈
      description: |
        只记录 analysis_id、可选 entry_id、理由与时间;不自动降级条目。
      parameters:
        - $ref: "#/components/parameters/AnalysisID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisFeedbackRequest"
      responses:
        "201":
          description: 已记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisFeedbackResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /analyses/{analysis_id}:
    get:
      operationId: getAnalysis
      summary: 读取分析
      description: 返回已保存的三层结果与快照;stale=true 表示数据已更新,仍可查看。
      parameters:
        - $ref: "#/components/parameters/AnalysisID"
      responses:
        "200":
          description: 已保存分析
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    MemberID:
      name: member_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ReportID:
      name: report_id
      in: path
      required: true
      description: 图像内容 sha256(64 hex,对外身份)
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    ItemID:
      name: item_id
      in: path
      required: true
      description: 指标项不透明句柄(BIGSERIAL;重跑识别后全换)
      schema: { type: integer, format: int64 }
    IndicatorName:
      name: name
      in: path
      required: true
      description: 指标项名称或标准码(通常为词典规范名;也接受 code / LOINC 用于跨面板连接;修正后以修正值为准),URL 编码
      schema: { type: string, minLength: 1 }
    Panel:
      name: panel
      in: path
      required: true
      description: 项目组稳定 code(与 PanelCode 枚举同源;非法 code 返回 400)
      schema: { $ref: "#/components/schemas/PanelCode" }
    AnalysisID:
      name: analysis_id
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    BadRequest:
      description: 请求体或参数不合法(message 说明原因)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: 目标不存在(unknown member/report/item/image)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [ok, version]
      properties:
        ok:
          type: boolean
          const: true
          description: 恒为 true(非 200 即不可用,无 ok:false 形态)
        version:
          type: string
          description: 数据服务版本,与 serve 实现常量及 info.version 同源(0.1.0)
          example: "0.1.0"
    MembersList:
      type: object
      additionalProperties: false
      required: [members]
      properties:
        members:
          type: array
          items: { $ref: "#/components/schemas/Member" }
    MemberSex:
      type: string
      enum: [male, female]
      description: 性别二选一。
    Member:
      type: object
      additionalProperties: false
      required: [member_id, name, is_child, sex, birth_date, created_at, latest_growth]
      properties:
        member_id:
          type: integer
          format: int64
          description: 外部句柄(数据库自增);不重用
        name:
          type: string
          minLength: 1
          description: 称呼(家庭真实称呼)
        is_child:
          type: boolean
          description: 是否孩子(由出生日期实时计算:未满 18 岁为 true;响应派生,不可写)
        sex:
          $ref: "#/components/schemas/MemberSex"
        birth_date:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: 出生日期(YYYY-MM-DD)
        created_at:
          type: string
          format: date-time
          description: 创建时间(RFC3339;列表按 member_id 升序返回,created_at 仅展示)
        latest_growth:
          oneOf:
            - $ref: "#/components/schemas/GrowthRecord"
            - type: "null"
          description: 最近一次生长记录(按测量日期降序);没有记录为 null
    GrowthSource:
      type: string
      enum: [measured, report]
      description: 生长记录来源:实测 / 体检单。
    GrowthRecord:
      type: object
      additionalProperties: false
      required: [growth_id, member_id, measured_on, height_cm, weight_kg, source, bmi, weight_status]
      description: |
        一条生长记录。BMI 由测量时点的身高体重实时计算,不缓存;weight_status 为超重 / 肥胖判定,
        年龄性别百分位规则落地前为 null。
      properties:
        growth_id:
          type: integer
          format: int64
        member_id:
          type: integer
          format: int64
        measured_on:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: 测量日期(YYYY-MM-DD)
        height_cm:
          type: [number, "null"]
          description: 身高(cm);可单填体重
        weight_kg:
          type: [number, "null"]
          description: 体重(kg);可单填身高
        source:
          $ref: "#/components/schemas/GrowthSource"
        bmi:
          type: [number, "null"]
          description: BMI = 体重(kg) / 身高(m)²,保留一位小数;身高体重缺一时为 null
        weight_status:
          type: [string, "null"]
          description: 超重 / 肥胖判定;百分位规则落地前为 null
    GrowthRecordCreate:
      type: object
      additionalProperties: false
      required: [measured_on, source]
      anyOf:
        - { required: [height_cm] }
        - { required: [weight_kg] }
      properties:
        measured_on:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        height_cm:
          type: number
          exclusiveMinimum: 0
          description: 身高(cm)
        weight_kg:
          type: number
          exclusiveMinimum: 0
          description: 体重(kg)
        source:
          $ref: "#/components/schemas/GrowthSource"
    GrowthList:
      type: object
      additionalProperties: false
      required: [records]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/GrowthRecord" }
    MemberCreate:
      type: object
      additionalProperties: false
      required: [name, sex, birth_date]
      properties:
        name:
          type: string
          minLength: 1
        sex:
          $ref: "#/components/schemas/MemberSex"
        birth_date:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    MemberUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1 }
        sex:
          $ref: "#/components/schemas/MemberSex"
        birth_date:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    ReportsList:
      type: object
      additionalProperties: false
      required: [reports]
      properties:
        reports:
          type: array
          items: { $ref: "#/components/schemas/ReportSummary" }
    ReportStatus:
      type: string
      enum: [success, partial, failed]
      description: |
        与识别端 report.schema.json 同一枚举。状态由后端按核对进度派生(派生单调):
        failed / success 恒定;partial → success 当且仅当未核对低置信计数 = 0,
        单向永不回退;无「撤销回未核对」。唯显式 override 重跑重置归档例外(见 POST /reports)。
    PanelCode:
      type: string
      enum: [cbc, urinalysis, liver, kidney, lipid, glucose,
             thyroid, sex_hormone, uric_acid, electrolyte, vitanemia,
             infection, autoimmune, coag, imaging, clinical_note, other]
      description: |
        项目组 code(与识别端 report.schema.json 的 panel 枚举同源):指标项必须属于其
        report_type 的允许集合,other 是唯一跨类别兜底。项目组是浏览入口,不是指标过滤器。
    FlagCounts:
      type: object
      additionalProperties: false
      required: [high, low, abnormal, unknown]
      description: 按 flag 异常计数徽标口径(时间线卡片);缺档即 0。unknown 只统计可操作/抽取失败原因,no_reference/信息项/叙述体不计数。
      properties:
        high: { type: integer, minimum: 0 }
        low: { type: integer, minimum: 0 }
        abnormal: { type: integer, minimum: 0 }
        unknown: { type: integer, minimum: 0 }
    ReportSummary:
      description: 时间线卡片;详情响应复用本头部字段(ReportDetail 加 items)。
      type: object
      additionalProperties: false
      required:
        [report_id, member_id, report_type, report_date, status, fail_reason,
         flag_counts, panels, not_tested_count, unreviewed_low_confidence_count]
      properties:
        report_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 图像内容 sha256(对外身份,全仓统一;每图一行)
        member_id:
          type: [integer, "null"]
          format: int64
          description: 归属成员;null = 存量 CLI 时代报告无主(可后续改派)
        report_type:
          type: string
          minLength: 1
          description: 报告类别(与识别端 report_type 同契约)
        report_date:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: 检查日期 YYYY-MM-DD;识别失败且未补录为 null(dateless 卡片沉底不破坏排序)
        status:
          $ref: "#/components/schemas/ReportStatus"
        fail_reason:
          type: [string, "null"]
          description: 识别失败原因(pipeline 产出;仅 failed 报告有值)
        flag_counts:
          $ref: "#/components/schemas/FlagCounts"
        panels:
          type: array
          items: { $ref: "#/components/schemas/PanelCode" }
          description: |
            报告级项目组,有序(命中项数降序、同数按固定优先级);panels[0] 为卡片主标签。
            未回填存量为空数组,App 回退 report_type;failed 报告新识别为 [other]。
        not_tested_count:
          type: integer
          minimum: 0
          description: 本次检查未做该项(flag=not_tested)的指标项数;信息徽标,不进入待处理/异常计数。
        unreviewed_low_confidence_count:
          type: integer
          minimum: 0
          description: |
            「剩余 N 项未核对」徽标。响应派生值(不落列,ADR-0005):统计报告内
            review_status=unreviewed 且 low_confidence 的指标项;success 报告也可能
            有少量低置信项待核对,如实计数;failed 报告无可核对项自然为 0;
            not_tested 项不参与该计数。
    ReportDetail:
      type: object
      additionalProperties: false
      required: [report_id, member_id, report_type, report_date, status, fail_reason,
        flag_counts, panels, not_tested_count, unreviewed_low_confidence_count, items]
      properties:
        report_id:
          type: string
          pattern: "^[0-9a-f]{64}$"
        member_id:
          type: [integer, "null"]
          format: int64
        report_type:
          type: string
          minLength: 1
        report_date:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        status:
          $ref: "#/components/schemas/ReportStatus"
        fail_reason:
          type: [string, "null"]
        flag_counts:
          $ref: "#/components/schemas/FlagCounts"
        panels:
          type: array
          items: { $ref: "#/components/schemas/PanelCode" }
          description: 报告级项目组(有序;空数组 = 未回填存量,详情按 report_type 单组回退)
        not_tested_count:
          type: integer
          minimum: 0
        unreviewed_low_confidence_count:
          type: integer
          minimum: 0
        sections:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/ReportSection" }
          minItems: 1
          description: 报告级叙述段落(影像等叙述型报告);缺省或 null 表示无段落,数组顺序即展示顺序
        items:
          type: array
          items: { $ref: "#/components/schemas/ReportItem" }
    ReportSection:
      type: object
      additionalProperties: false
      required: [kind, text, ocr_lines]
      description: 报告级叙述段落(只读展示;与识别端 reportSection 同源,行号在 HTTP 侧映射为行链接)。
      properties:
        kind:
          type: string
          minLength: 1
          description: 段落类别;影像为 exam_name / findings / impression,病历为 chief_complaint / present_illness / diagnosis / treatment / note;数组顺序即展示顺序
        text:
          type: string
          minLength: 1
          description: 段落原文(OCR 行按序以换行拼接)
        ocr_lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/OcrLineLink" }
          description: 段落组成 OCR 行的行链接(行号→框,与 items 的 ocr_lines 同源同构)
    OcrLineLink:
      type: object
      additionalProperties: false
      required: [line, box]
      description: 图像区域 ↔ 原始 OCR 行文 ↔ 解析值三方对照的行链接。
      properties:
        line:
          type: integer
          minimum: 0
          description: OCR 行下标(0-based,与 ocr_result 的 boxes/txts 下标一致)
        box:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
          description: 该行四点多边形顶点 [x,y](识别端识别坐标系同源)
    ItemIDHandle:
      type: integer
      format: int64
      description: BIGSERIAL 不透明句柄;重跑识别后全部更换,客户端不可当持久主键
    ReviewStatus:
      type: string
      enum: [unreviewed, confirmed, corrected]
      description: |
        核对状态机:未核对 --确认|修正--> 已确认|已修正。任何状态可再次确认或修正
        (决策可重复);每次修正 append 一条修正对(before = 上次生效值);确认不产生
        修正对记录;最终状态 = 最后一次动作;无「撤销回未核对」——误确认的出口是修正。
    ReportItem:
      description: |
        单个指标项的 HTTP 形状。name/value/unit/ref_range/method/flag/low_confidence/
        raw_text 以及标准层字段 code/loinc/unit_display/unit_status/raw_*/ref_kind/
        result_kind/result_basis 与识别端 schemas/report.schema.json 的 reportItem 逐字段
        同源(该 schema additionalProperties:false 已冻结,无法 allOf 扩展,故此处镜像;
        互证测试锁死共享字段子树逐字节相等,防两份定义漂移);后四项为 HTTP 侧扩展
        (item_id / review_status / ocr_lines / prev)。
      type: object
      additionalProperties: false
      required: [item_id, name, panel, value, unit, ref_range, method, flag,
        low_confidence, raw_text, review_status, ocr_lines, prev]
      properties:
        item_id:
          $ref: "#/components/schemas/ItemIDHandle"
        name:
          type: string
          minLength: 1
          description: 规范名(词典映射后)
        panel:
          $ref: "#/components/schemas/PanelCode"
          description: 指标项项目组 code(详情按报告 panels 分组;不属于 panels 的项归末组「其他」)
        value:
          type: [string, "null"]
          description: "印刷原样数值字符串(如 '18.40'、'<2.00'、'70-80');无结果或解析失败为 null"
        unit:
          type: [string, "null"]
          description: '单位,如 g/L'
        ref_range:
          type: [string, "null"]
          description: '参考范围,一律从检查单抽取(决策 #8),如 115-150 或 <3.5'
        method:
          type: [string, "null"]
          description: "检测方法/实验方法列原样(如 '化学发光法');无该列或解析失败为 null"
        code:
          type: [string, "null"]
          description: "WS/T 886 标准码;未迁移/无标准码为 null"
        loinc:
          type: [string, "null"]
          description: "LOINC 码;无 exact 码为 null"
        analyte:
          type: [string, "null"]
          description: "分析物语义 key,取 LOINC component 风格的全称小写 snake_case(如 alanine_aminotransferase/hemoglobin);框架层按此匹配,未映射为 null"
        unit_display:
          type: [string, "null"]
          description: "人类可读展示单位(UI 优先);缺失时回退 unit"
        unit_status:
          enum: [verified, unverified, null]
          description: "单位核验状态;verified 仅当词典项 review_status=approved"
        raw_value:
          type: [string, "null"]
          description: "单据原文数值(换算前);识别端未产出为 null"
        raw_unit:
          type: [string, "null"]
          description: "单据原文单位(归一/换算前);识别端未产出为 null"
        raw_ref_range:
          type: [string, "null"]
          description: "单据原文参考范围(换算前);识别端未产出为 null"
        ref_kind:
          enum: [numeric, qualitative, ordinal, tiered, none, null]
          description: "参考范围类型;本期未分类为 null"
        result_kind:
          enum: [quantitative, ratio, arbitrary, titer, qualitative, microscopy, null]
          description: "结果类型;未迁移词典为 null"
        result_basis:
          enum: [FEU, DDU, null]
          description: "结果基准(D-二聚体 FEU/DDU);其他为 null"
        flag:
          enum: [normal, high, low, abnormal, unknown, not_tested]
          description: 值 vs 参考范围比较结果;high/low 只用于有方向的数值异常,abnormal 只用于无方向的定性异常,unknown 表示本应能比较但失败/暂不支持,not_tested 表示本次检查未做该项(结果与参考均为裸短横)
        flag_reason:
          enum: [ocr_miss, ocr_merge, extractor_pairing, no_reference,
                 qualitative_unsupported, unverified, narrative,
                 informational, indeterminate, scalar_ref, other]
          description: flag=unknown 的原因;normal/high/low/abnormal/not_tested 不出现该键
        low_confidence:
          type: boolean
          description: '该指标项任一组成行 OCR score < 0.8 时为 true(决策 #7)'
        raw_text:
          type: string
          minLength: 1
          description: 该指标项对应的原始 OCR 行文本,供人工核对
        review_status:
          $ref: "#/components/schemas/ReviewStatus"
        ocr_lines:
          type: array
          items: { $ref: "#/components/schemas/OcrLineLink" }
          description: 该指标项对应的 OCR 行链接(缩放到对应区域的定位依据)
        prev:
          oneOf:
            - $ref: "#/components/schemas/PrevValue"
            - type: "null"
          description: B2-lite「较上次」Δ 上一值(见 PrevValue);无有效基线为 null
    PrevValue:
      type: object
      additionalProperties: false
      required: [report_date, value, unit]
      description: 同成员 + 同规范名 + 同归一单位、report_date 严格早于当前报告的最近一份
        (与上传先后无关);任一侧无日期或仅有同日报告 → 不提供(宁缺毋错)。
      properties:
        report_date:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        value:
          type: string
          description: 印刷原样数值(与 value 同契约;Δ 由客户端 ParseFloat)
        unit:
          type: [string, "null"]
          description: 同指标自身的归一单位;Δ 同单位才可比,故基线值携带
    UploadResult:
      type: object
      additionalProperties: false
      required: [duplicate, report]
      properties:
        duplicate:
          type: boolean
          description: sha 命中已有报告(幂等重试)为 true;false = 新建归档或显式 override 重跑
        report:
          $ref: "#/components/schemas/ReportDetail"
    ReviewRequest:
      description: |
        核对请求体(单一契约字段集):confirm 分支只带 action(确认不产生修正对);
        correct 分支必带 action 且至少一项 value/unit/name/ref_range;
        no_reference 分支只带 action(家长确认纸面没有参考范围,flag 仍 unknown + reason=no_reference)。
        无 flag 字段——additionalProperties:false 直接拒绝手改 flag 请求。
      oneOf:
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              const: confirm
        - type: object
          additionalProperties: false
          required: [action]
          properties:
            action:
              const: no_reference
        - type: object
          additionalProperties: false
          required: [action]
          anyOf:
            - { required: [value] }
            - { required: [unit] }
            - { required: [name] }
            - { required: [ref_range] }
          properties:
            action:
              const: correct
            value:
              type: string
              description: 修正后的印刷数值字符串(家长照纸面事实直书)
            unit:
              type: string
            name:
              type: string
              minLength: 1
            ref_range:
              type: string
              description: 参考范围照纸补录;flag 随修正后 value×ref_range 重算
    ReviewResult:
      type: object
      additionalProperties: false
      required: [report_id, status, unreviewed_low_confidence_count, item]
      properties:
        report_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        status:
          $ref: "#/components/schemas/ReportStatus"
        unreviewed_low_confidence_count: { type: integer, minimum: 0 }
        item:
          $ref: "#/components/schemas/ReportItem"
      description: 单响应刷新整屏:核对后整份报告的最新派生状态 + 本次动作的指标项。
    CorrectionValues:
      type: object
      additionalProperties: false
      required: [name, value, unit, ref_range]
      properties:
        name: { type: [string, "null"] }
        value: { type: [string, "null"] }
        unit: { type: [string, "null"] }
        ref_range: { type: [string, "null"] }
    CorrectionPair:
      description: |
        修正对 append-only 表形状(落库:correction_pairs;本期只存不回流,ADR-0005):
        before→after 全集(四项纸面事实字段各一份快照)+ 原始行文 + OCR 行下标 +
        时间。确认不产生记录,只有修正 append;按可回流设计,未来直接喂 gt_eval 零迁移。
      type: object
      additionalProperties: false
      required: [item_id, before, after, raw_text, ocr_line_numbers, created_at]
      properties:
        item_id: { $ref: "#/components/schemas/ItemIDHandle" }
        before:
          $ref: "#/components/schemas/CorrectionValues"
        after:
          $ref: "#/components/schemas/CorrectionValues"
        raw_text:
          type: string
          minLength: 1
          description: 该指标项修正前后的原始行文(同一份,修正不改行文归属)
        ocr_line_numbers:
          type: array
          items: { type: integer, minimum: 0 }
          description: raw_text 对应的 OCR 行下标(0-based,与 ocr_lines 同下标口径)
        created_at:
          type: string
          format: date-time
    TrendResult:
      type: object
      additionalProperties: false
      required: [member_id, name, points]
      properties:
        member_id: { type: integer, format: int64 }
        name: { type: string, minLength: 1 }
        points:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }
    TrendPoint:
      type: object
      additionalProperties: false
      required: [report_id, report_date, value, unit, unit_display, unit_status,
        ref_range, method, flag, low_confidence, reviewed]
      properties:
        report_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        report_date:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: null 的点不参与画线,客户端在图下以「缺日期 N 份」提示
        value:
          type: [string, "null"]
          description: 印刷原样数值(与指标项 value 同契约);Δ 自行 ParseFloat
        unit: { type: [string, "null"], description: canonical UCUM 单位(连接/门控键) }
        unit_display:
          type: [string, "null"]
          description: 人类可读展示单位(UI 优先);缺失时回退 unit
        unit_status:
          type: [string, "null"]
          enum: [verified, unverified, null]
          description: verified 才默认参与趋势连接;unverified 点 App 不连线
        ref_range: { type: [string, "null"], description: 参考范围淡带铺图依据 }
        method: { type: [string, "null"], description: 解释跨院参考范围差异 }
        flag:
          type: string
          enum: [normal, high, low, abnormal, unknown, not_tested]
        low_confidence: { type: boolean }
        reviewed:
          type: boolean
          description: |
            响应派生信任标记(review_status ∈ {confirmed, corrected}):实心 =
            reviewed 或非低置信;空心 = 未核对低置信点——不隐藏数据、不冒充可信。
    PanelsList:
      type: object
      additionalProperties: false
      required: [panels]
      properties:
        panels:
          type: array
          items: { $ref: "#/components/schemas/PanelSummary" }
    PanelSummary:
      type: object
      additionalProperties: false
      required: [panel, report_count, item_count, abnormal_count, latest_report_date,
        latest_report_id, report_types, narrative]
      description: 项目列表一行;只返回当前成员非 failed 报告里实际出现过的项目。
      properties:
        panel:
          $ref: "#/components/schemas/PanelCode"
        report_count:
          type: integer
          minimum: 1
          description: 当前成员非 failed 报告里包含该项目的份数
        item_count:
          type: integer
          minimum: 0
          description: 该项目下趋势键 + canonical unit 去重后的指标数(含未检测项)
        abnormal_count:
          type: integer
          minimum: 0
          description: 每个趋势键 + canonical unit 取最近非 not_tested 值后 flag ∈ high/low/abnormal 的数量
        latest_report_date:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: 包含该项目的最新报告日期;只有无日期报告时为 null
        latest_report_id:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
          description: 最新报告身份;无报告时为 null(项目列表不返回这种行)
        report_types:
          type: array
          items: { type: string, minLength: 1 }
          description: 来源报告类别(other 行显示「其他 · 临检、免疫」)
        narrative:
          type: boolean
          description: true = 影像等叙述型项目,点击直接打开最新报告详情
    PanelDetail:
      type: object
      additionalProperties: false
      required: [panel, member_id, report_count, latest_report_date, latest_report_id,
        report_types, narrative, items]
      properties:
        panel:
          $ref: "#/components/schemas/PanelCode"
        member_id:
          type: integer
          format: int64
        report_count:
          type: integer
          minimum: 0
          description: 当前成员非 failed 报告里包含该项目的份数
        latest_report_date:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        latest_report_id:
          type: [string, "null"]
          pattern: "^[0-9a-f]{64}$"
        report_types:
          type: array
          items: { type: string, minLength: 1 }
          description: 来源报告类别(other 详情头部显示)
        narrative:
          type: boolean
          description: true 时 items=[];App 不打开该详情,项目列表直接进报告详情
        items:
          type: array
          items: { $ref: "#/components/schemas/PanelItem" }
    PanelItem:
      type: object
      additionalProperties: false
      required: [key, name, unit, ref_range, latest, points, report_count, not_tested_count,
        latest_report_not_tested]
      description: |
        项目详情中按趋势键(code 优先,缺失用 loinc,再回退规范名)+ canonical unit
        分行的指标。同一分析物跨面板连接。latest 为最近一个非 not_tested 点
        (没有则 null);points 为同组跨报告点,report_date 升序、不含 not_tested。
      properties:
        key:
          type: string
          minLength: 1
          description: 趋势连接键(code > loinc > name);App 用于跨面板同一分析物去重
        name:
          type: string
          minLength: 1
          description: 词典规范名(修正后以修正值为准;取最近点名称)
        unit:
          type: [string, "null"]
          description: canonical UCUM 单位(跨单位分行不合并)
        ref_range:
          type: [string, "null"]
          description: 取 latest 点的参考范围
        latest:
          oneOf:
            - $ref: "#/components/schemas/TrendPoint"
            - type: "null"
        points:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }
        report_count:
          type: integer
          minimum: 0
          description: 有非 not_tested 点的报告数
        not_tested_count:
          type: integer
          minimum: 0
          description: 该指标被标为 not_tested 的报告数
        latest_report_not_tested:
          type: boolean
          description: 最近一份含该指标的报告中此项是否为 not_tested
    AnalysisEntry:
      type: string
      enum: [panel, indicator, clinical_note]
      description: 分析入口:项目详情 / 单指标 / 病历详情。
    AnalysisStatus:
      type: string
      enum: [success, insufficient_evidence]
      description: |
        事实层状态。success = 有至少一个有效点或病历;insufficient_evidence = 没有任何
        通过信任门控的有效点,事实层降级为「证据不足,请先核对」,不输出偏离结论。
    AnalysisChange:
      type: string
      enum: [up, down, flat, unknown]
      description: 最近两个有效点的数值变化方向;无法解析数值时为 unknown。
    AnalysisExclusionReason:
      type: string
      enum: [cross_member, wrong_panel, failed_report, narrative_report, no_date,
             not_tested, unverified_unit, low_confidence, missing_value, unit_mismatch,
             outside_window, point_cap, no_name, no_note_body]
      description: 未纳入原因码;默认排除项不得作为任何结论依据。
    AnalysisRequest:
      type: object
      additionalProperties: false
      required: [member_id, panel, entry]
      properties:
        member_id:
          type: integer
          format: int64
        panel:
          $ref: "#/components/schemas/PanelCode"
        entry:
          $ref: "#/components/schemas/AnalysisEntry"
        indicator_name:
          type: string
          minLength: 1
          description: 单指标入口必填;服务端据此找到所属 Panel 并自动扩展。
        report_sha:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 病历入口必填(目标病历报告 id);其他入口可选,当前不改变事实层范围。
        window_months:
          type: integer
          enum: [6, 12, 24]
          default: 12
          description: 回溯窗口月数;缺省 12,用户可改为 6 / 24。
    AnalysisResult:
      type: object
      additionalProperties: false
      required: [analysis_id, status, layers, snapshot, sources, quota, stale]
      properties:
        analysis_id:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/AnalysisStatus"
        layers:
          $ref: "#/components/schemas/AnalysisLayers"
        snapshot:
          $ref: "#/components/schemas/AnalysisSnapshot"
        sources:
          type: array
          items: { $ref: "#/components/schemas/AnalysisSource" }
        quota:
          $ref: "#/components/schemas/AnalysisQuota"
        stale:
          type: boolean
          description: 数据已更新;仍可查看,展示时标注「数据已更新」。
    AnalysisLayers:
      type: object
      additionalProperties: false
      required: [facts]
      properties:
        facts:
          $ref: "#/components/schemas/AnalysisFacts"
        framework:
          $ref: "#/components/schemas/AnalysisFramework"
        explanation:
          $ref: "#/components/schemas/AnalysisExplanation"
    AnalysisQuota:
      type: object
      additionalProperties: false
      required: [used_today, limit_today, explanation_available]
      properties:
        used_today: { type: integer, minimum: 0 }
        limit_today: { type: integer, minimum: 0 }
        explanation_available:
          type: boolean
          description: 今日解释层额度仍可用,或本次分析已保存了解释层。
        explanation_reason:
          type: string
          description: 省略解释层的原因(quota_exhausted / llm_timeout / llm_invalid_json / no_entries 等)。
    AnalysisFramework:
      type: object
      additionalProperties: false
      required: [labels]
      description: 框架层:代码算得出的判读标签与固定解释文案;无规则时 labels 为空数组。
      properties:
        labels:
          type: array
          items: { $ref: "#/components/schemas/AnalysisFrameworkLabel" }
    AnalysisFrameworkLabel:
      type: object
      additionalProperties: false
      required: [code, label, explanation, value, evidence_ids, sources]
      properties:
        code: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        explanation: { type: string, minLength: 1 }
        value: { type: [string, "null"] }
        evidence_ids:
          type: array
          items: { type: string, minLength: 1 }
        sources:
          type: array
          items: { $ref: "#/components/schemas/AnalysisSource" }
    AnalysisExplanation:
      type: object
      additionalProperties: false
      required: [sections, truncated]
      description: 解释层;无条目 / 失败时整层省略,不显示空状态。
      properties:
        sections:
          type: array
          items: { $ref: "#/components/schemas/AnalysisExplanationSection" }
        truncated:
          type: boolean
          description: 模型输出达到单次 output 上限被截断。
    AnalysisExplanationSection:
      type: object
      additionalProperties: false
      required: [entry_id, evidence_ids, bridge_text, explanation, check_directions, general_advice, track_items]
      description: |
        一条解释。bridge_text / evidence_ids 由模型输出并经服务端校验；
        四段式医学原文由服务端从 accepted 条目逐字拼接，模型无法修改。
      properties:
        entry_id: { type: string, minLength: 1 }
        evidence_ids:
          type: array
          items: { type: string, minLength: 1 }
        bridge_text:
          type: string
          minLength: 1
          maxLength: 200
        explanation:
          type: string
          minLength: 1
          description: 可能原因（条目原文）。
        check_directions:
          type: array
          items: { type: string }
          description: 进一步检查（条目原文，可为空）。
        general_advice:
          type: array
          items: { type: string }
          description: 生活建议（条目原文，可为空）。
        track_items:
          type: array
          items: { type: string }
          description: 长期跟踪的趋势键（条目原文）。
        source_ids:
          type: array
          items: { $ref: "#/components/schemas/AnalysisSource" }
          description: 「查看依据」由代码从条目 source_ids 渲染，模型不得自行书写。
    AnalysisFacts:
      type: object
      additionalProperties: false
      required: [entry, panel, indicator_name, expanded_from_indicator, window, reports,
                 notes, deviations, history, uncomparable, excluded, insufficient_evidence]
      description: |
        事实层只陈述数据与病历原文:纳入范围、偏离参考范围的指标项、与本人历史比较、
        相关病历诊断与处理原文、未纳入项及原因。不生成医学判断。
      properties:
        entry:
          $ref: "#/components/schemas/AnalysisEntry"
        panel:
          $ref: "#/components/schemas/PanelCode"
        indicator_name:
          type: [string, "null"]
          description: 单指标入口的原始指标名;其他入口为 null。
        expanded_from_indicator:
          type: boolean
          description: true = 从单指标自动扩展至所属 Panel,结果页需提示本次范围。
        window:
          $ref: "#/components/schemas/AnalysisWindow"
        reports:
          type: array
          items: { $ref: "#/components/schemas/AnalysisReportRef" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/AnalysisNote" }
        deviations:
          type: array
          items: { $ref: "#/components/schemas/AnalysisEvidencePoint" }
        history:
          type: array
          items: { $ref: "#/components/schemas/AnalysisHistory" }
        uncomparable:
          type: array
          items: { $ref: "#/components/schemas/AnalysisUncomparable" }
        excluded:
          type: array
          items: { $ref: "#/components/schemas/AnalysisExclusion" }
        insufficient_evidence:
          type: boolean
          description: 没有任何有效点 / 病历时的降级标记;此时不输出偏离结论。
    AnalysisWindow:
      type: object
      additionalProperties: false
      required: [months, from, to, sparse]
      properties:
        months:
          type: integer
          description: 用户选择的窗口月数(6 / 12 / 24)。
        from:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: 实际使用的窗口起点;稀疏扩展时向前到 24 个月。
        to:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: 窗口锚点 = 分析时刻当日。
        sparse:
          type: boolean
          description: 任一趋势键在 12 个月内不足 2 个有效点并触发稀疏扩展。
    AnalysisReportRef:
      type: object
      additionalProperties: false
      required: [report_id, report_date, report_type]
      properties:
        report_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        report_date:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        report_type: { type: string, minLength: 1 }
    AnalysisNote:
      type: object
      additionalProperties: false
      required: [report_id, report_date, outside_window, sections]
      properties:
        report_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        report_date:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        outside_window:
          type: boolean
          description: true = 早于分析窗口的背景病历,不作为本次结论依据。
        sections:
          type: array
          items: { $ref: "#/components/schemas/AnalysisNoteSection" }
    AnalysisNoteSection:
      type: object
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          minLength: 1
          description: 诊断 / 处理原文;切不出标题时为 note(整页兜底)。
        text: { type: string, minLength: 1 }
    AnalysisEvidencePoint:
      type: object
      additionalProperties: false
      required: [evidence_id, report_id, report_date, report_type, trend_key, name,
                 unit, unit_display, value, ref_range, flag]
      description: 事实层的一个证据点;每个数值绑定报告日期、趋势键、单位与 flag。
      properties:
        evidence_id: { type: string, minLength: 1 }
        report_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        report_date:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        report_type: { type: string, minLength: 1 }
        trend_key: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        unit: { type: [string, "null"] }
        unit_display: { type: [string, "null"] }
        value: { type: [string, "null"] }
        ref_range: { type: [string, "null"] }
        flag:
          type: string
          enum: [normal, high, low, abnormal, unknown, not_tested]
    AnalysisHistory:
      type: object
      additionalProperties: false
      required: [trend_key, name, unit, unit_display, points, latest, previous,
                 change, highest, lowest, point_count, sparse, comparable]
      properties:
        trend_key: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        unit: { type: [string, "null"] }
        unit_display: { type: [string, "null"] }
        points:
          type: array
          items: { $ref: "#/components/schemas/AnalysisEvidencePoint" }
        latest:
          $ref: "#/components/schemas/AnalysisEvidencePoint"
        previous:
          oneOf:
            - $ref: "#/components/schemas/AnalysisEvidencePoint"
            - type: "null"
        change:
          $ref: "#/components/schemas/AnalysisChange"
        highest: { type: boolean }
        lowest: { type: boolean }
        point_count: { type: integer, minimum: 1 }
        sparse:
          type: boolean
          description: 该趋势键触发了稀疏扩展 / 历史数据较少。
        comparable:
          type: boolean
          description: false = 最近点 flag=unknown,无法与参考范围比较。
    AnalysisUncomparable:
      type: object
      additionalProperties: false
      required: [trend_key, name, unit, latest, reason]
      properties:
        trend_key: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        unit: { type: [string, "null"] }
        latest:
          $ref: "#/components/schemas/AnalysisEvidencePoint"
        reason: { type: string, minLength: 1 }
    AnalysisExclusion:
      type: object
      additionalProperties: false
      required: [report_id, report_date, trend_key, name, reason]
      properties:
        report_id: { type: [string, "null"] }
        report_date:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        trend_key: { type: [string, "null"] }
        name: { type: [string, "null"] }
        reason:
          $ref: "#/components/schemas/AnalysisExclusionReason"
    AnalysisSnapshot:
      type: object
      additionalProperties: false
      required: [member_id, member_name, panel, entry, indicator_name, window_months,
                 window_from, window_to, rule_version, data_version, points, notes]
      properties:
        member_id: { type: integer, format: int64 }
        member_name: { type: string, minLength: 1 }
        member_sex:
          type: string
          enum: [male, female]
          description: 框架层年龄性别规则输入;旧快照可缺省。
        member_birth_date:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: 框架层年龄规则输入;旧快照可缺省。
        panel:
          $ref: "#/components/schemas/PanelCode"
        entry:
          $ref: "#/components/schemas/AnalysisEntry"
        indicator_name: { type: [string, "null"] }
        window_months: { type: integer }
        window_from: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        window_to: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        rule_version: { type: string, minLength: 1 }
        prompt_version:
          type: string
          minLength: 1
          description: 解释层 prompt 版本;旧快照可缺省。
        entry_versions:
          type: object
          additionalProperties: { type: string }
          description: 命中的知识条目 id → version;旧快照/无条目时可缺省。
        data_version:
          type: string
          minLength: 1
          description: 生成快照时的成员数据指纹;当前数据不同即 stale=true。
        points:
          type: array
          items: { $ref: "#/components/schemas/AnalysisSnapshotPoint" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/AnalysisSnapshotNote" }
    AnalysisSnapshotPoint:
      type: object
      additionalProperties: false
      required: [evidence_id, report_id, report_date, trend_key, unit, value, flag]
      properties:
        evidence_id: { type: string, minLength: 1 }
        report_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        report_date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        trend_key: { type: string, minLength: 1 }
        unit: { type: [string, "null"] }
        value: { type: [string, "null"] }
        flag: { type: string, minLength: 1 }
    AnalysisSnapshotNote:
      type: object
      additionalProperties: false
      required: [report_id, report_date, outside_window, section_kinds]
      properties:
        report_id: { type: string, pattern: "^[0-9a-f]{64}$" }
        report_date:
          type: [string, "null"]
          pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        outside_window: { type: boolean }
        section_kinds:
          type: array
          items: { type: string, minLength: 1 }
    AnalysisSource:
      type: object
      additionalProperties: false
      required: [standard, note, url]
      description: 框架层 / 解释层引用的标准或指南;由代码渲染,模型不得自行书写。
      properties:
        standard: { type: string, minLength: 1 }
        note: { type: string, minLength: 1 }
        url: { type: [string, "null"] }
    AnalysisFeedbackRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        entry_id:
          type: string
          maxLength: 200
          description: 可选;当前结果级按钮不传。
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AnalysisFeedbackResult:
      type: object
      additionalProperties: false
      required: [feedback_id, created_at]
      properties:
        feedback_id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
    AnalysisMetrics:
      type: object
      additionalProperties: false
      required: [from, to, analyses, feedback, feedback_rate, degradations,
                 degradation_rate, degradation_kinds]
      properties:
        from: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        to: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        analyses: { type: integer, minimum: 0 }
        feedback: { type: integer, minimum: 0 }
        feedback_rate: { type: number, minimum: 0 }
        degradations: { type: integer, minimum: 0 }
        degradation_rate: { type: number, minimum: 0 }
        degradation_kinds:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
    Error:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: 中性事实侧错误说明(不诊断、不猜测)
