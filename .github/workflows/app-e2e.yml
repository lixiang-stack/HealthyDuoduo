name: App E2E

# 家长侧 App 的 UI 端到端回归(Expo Web + 专用 compose 栈)。
# 首版为「连续 10 次本地全绿」后的 PR 门禁;路径过滤只覆盖会改变 App/栈/契约的改动。
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "cmd/hdd/**"
      - "internal/**"
      - "schemas/**"
      - "recognizer/**"
      - "deploy/**"
      - "samples/**"
      - ".github/workflows/app-e2e.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "cmd/hdd/**"
      - "internal/**"
      - "schemas/**"
      - "recognizer/**"
      - "deploy/**"
      - "samples/**"
      - ".github/workflows/app-e2e.yml"

permissions:
  contents: read

concurrency:
  group: app-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci

      - name: Install Chromium
        run: npx @e2e-dev/web install chromium --with-deps

      # run.sh 自起专用栈(hdd-e2e,端口 58080/58000/55432/58333),用例 beforeAll seed 后跑核心链路,结束拆栈。
      - name: Run App E2E
        run: npm run e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-report
          path: |
            apps/mobile/.e2e/report.json
            apps/mobile/.e2e/junit.xml
          if-no-files-found: warn

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-artifacts
          path: apps/mobile/.e2e/results
          if-no-files-found: warn
          retention-days: 7
