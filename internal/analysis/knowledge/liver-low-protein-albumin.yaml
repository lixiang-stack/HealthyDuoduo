id: liver-low-protein-albumin
priority: 20
trigger:
  panel: liver
  any_flag_low: [total_protein, albumin]
  all_normal: []
explanation: 总蛋白由白蛋白和球蛋白组成，总蛋白低不一定代表白蛋白低。白蛋白偏低可能与肝脏合成减少、蛋白质从肠道或尿液丢失、营养摄入不足或炎症有关；单次结果不能确定原因，需要结合症状、体重变化和医生复查。
check_directions:
  - 把结果和症状、近期体重变化、既往病史带给医生看，由医生判断是否复查。
  - 医生可能根据情况安排尿蛋白检查。
  - 如果同时有水肿、尿量明显减少或持续腹泻，请尽快让医生评估。
general_advice:
  - 按年龄和身体状况保持均衡饮食，不自行长期限蛋白。
  - 不要自行使用蛋白粉或补充剂；是否需要补充由医生或营养师决定。
  - 定期记录体重；儿童可记录生长曲线，复诊时带给医生。
  - 不要因一次结果大幅改变饮食；先和医生确认原因。
track_items: [TP, ALB]
