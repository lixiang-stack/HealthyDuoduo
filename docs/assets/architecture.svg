<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="arch-title arch-desc" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <title id="arch-title">HealthyDuoduo 产品架构</title>
  <desc id="arch-desc">Android 或 iOS App 同时提供健康档案与育儿两个产品域，经 HTTP API 访问 Go 数据服务 hdd。hdd 调用 Python recognizer 完成 OCR 与规则处理，业务数据写入 PostgreSQL，原图写入 SeaweedFS；配置 OpenAI 兼容端点与模型后可选调用解释层，API key 可选。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-optional" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#db2777"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">HealthyDuoduo 产品架构</text>
  <text x="40" y="68" font-size="13" fill="#64748b">健康档案 + 育儿；App 只访问 hdd，数据与识别服务在部署主机内部</text>

  <g font-size="12.5" fill="#475569">
    <line x1="860" y1="42" x2="898" y2="42" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="908" y="46">运行时</text>
    <line x1="980" y1="42" x2="1018" y2="42" stroke="#db2777" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-optional)"/>
    <text x="1028" y="46">可选 / 外部</text>
  </g>

  <rect x="30" y="84" width="900" height="650" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="54" y="112" font-size="14" font-weight="600" fill="#475569">部署主机 · Docker</text>

  <!-- App -->
  <rect x="60" y="140" width="250" height="440" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="82" y="178" font-size="20" font-weight="700" fill="#1e3a8a">Android / iOS App</text>
  <text x="82" y="201" font-size="12.5" fill="#1d4ed8">Expo / React Native</text>
  <line x1="82" y1="216" x2="288" y2="216" stroke="#bfdbfe"/>
  <text x="82" y="244" font-size="13" font-weight="700" fill="#1e40af">健康档案</text>
  <g font-size="13" fill="#1e3a8a">
    <text x="82" y="270">• 上传检查单 / 报告时间线</text>
    <text x="82" y="294">• 报告详情 / 核对</text>
    <text x="82" y="318">• 项目 / 趋势 / 解读</text>
  </g>
  <line x1="82" y1="340" x2="288" y2="340" stroke="#bfdbfe"/>
  <text x="82" y="368" font-size="13" font-weight="700" fill="#1e40af">育儿</text>
  <g font-size="13" fill="#1e3a8a">
    <text x="82" y="394">• 喂养 / 尿布 / 睡眠 / 辅食</text>
    <text x="82" y="418">• 今天 / 统计</text>
    <text x="82" y="442">• 提醒由本机最新记录派生</text>
  </g>
  <rect x="82" y="474" width="206" height="78" rx="9" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="96" y="498" font-size="12" font-weight="700" fill="#1e40af">后端地址</text>
  <text x="96" y="520" font-size="11" fill="#1e3a8a" font-family="'SFMono-Regular',Consolas,monospace">http://&lt;host&gt;:8080/api/v1</text>
  <text x="96" y="540" font-size="11.5" fill="#475569">设置页保存并通过健康检查</text>

  <!-- hdd -->
  <rect x="360" y="140" width="260" height="440" rx="16" fill="#ecfdf5" stroke="#34d399" stroke-width="1.5"/>
  <text x="382" y="178" font-size="20" font-weight="700" fill="#065f46">hdd serve</text>
  <text x="382" y="201" font-size="12.5" fill="#047857">Go · HTTP API /api/v1</text>
  <line x1="382" y1="216" x2="598" y2="216" stroke="#a7f3d0"/>
  <g font-size="13" fill="#065f46">
    <text x="382" y="246">• 成员 / 报告 / 时间线</text>
    <text x="382" y="274">• 上传编排 / sha256 幂等</text>
    <text x="382" y="302">• 核对 / 项目 / 趋势</text>
    <text x="382" y="330">• 育儿事件 / 生长记录</text>
    <text x="382" y="358">• 分析与解释层编排</text>
    <text x="382" y="386">• 启动时自动迁移数据库</text>
    <text x="382" y="414">• 图像代理（S3 → App）</text>
  </g>
  <rect x="382" y="454" width="216" height="94" rx="9" fill="#d1fae5" stroke="#a7f3d0"/>
  <text x="396" y="478" font-size="12" font-weight="700" fill="#065f46">入口</text>
  <text x="396" y="500" font-size="11.5" fill="#065f46" font-family="'SFMono-Regular',Consolas,monospace">hdd serve --addr :8080</text>
  <text x="396" y="522" font-size="11.5" fill="#475569">唯一对 App 暴露的服务</text>

  <!-- PostgreSQL -->
  <rect x="680" y="110" width="230" height="210" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="700" y="145" font-size="19" font-weight="700" fill="#9a3412">PostgreSQL</text>
  <text x="700" y="168" font-size="12.5" fill="#c2410c">业务数据</text>
  <line x1="700" y1="182" x2="890" y2="182" stroke="#fed7aa"/>
  <g font-size="12.5" fill="#7c2d12">
    <text x="700" y="208">• members / reports</text>
    <text x="700" y="234">• report_items / ocr_results</text>
    <text x="700" y="260">• analyses / growth</text>
    <text x="700" y="286">• care_events</text>
  </g>

  <!-- SeaweedFS -->
  <rect x="680" y="350" width="230" height="170" rx="14" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="700" y="385" font-size="19" font-weight="700" fill="#075985">SeaweedFS</text>
  <text x="700" y="408" font-size="12.5" fill="#0369a1">S3 兼容对象存储</text>
  <line x1="700" y1="422" x2="890" y2="422" stroke="#bae6fd"/>
  <g font-size="12.5" fill="#0c4a6e">
    <text x="700" y="448">• bucket：raw</text>
    <text x="700" y="474">• key：图像 sha256</text>
    <text x="700" y="500">• 原图 / 转正后的图像</text>
  </g>

  <!-- recognizer -->
  <rect x="360" y="610" width="260" height="110" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="382" y="642" font-size="19" font-weight="700" fill="#5b21b6">recognizer</text>
  <text x="382" y="665" font-size="12.5" fill="#6d28d9">Python FastAPI · RapidOCR / ONNX CPU</text>
  <g font-size="12.5" fill="#4c1d95">
    <text x="382" y="688">• OCR → 方向转正 → 词典 / 规则后处理</text>
    <text x="382" y="708">• 无状态：不落库，返回 OCR + 报告</text>
  </g>

  <!-- LLM -->
  <text x="960" y="574" font-size="12.5" font-weight="600" fill="#9d174d">外部服务（可选）</text>
  <rect x="960" y="590" width="200" height="140" rx="14" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="980" y="624" font-size="18" font-weight="700" fill="#9d174d">模型端点</text>
  <text x="980" y="646" font-size="12" fill="#be185d">OpenAI 兼容 · Ollama / 云端</text>
  <g font-size="12.5" fill="#831843">
    <text x="980" y="672">• 仅解释层使用</text>
    <text x="980" y="696">• 配置端点 / 模型后启用</text>
    <text x="980" y="718">• key 可选</text>
  </g>

  <!-- flows -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <line x1="310" y1="300" x2="360" y2="300" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="620" y1="210" x2="680" y2="210" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="620" y1="430" x2="680" y2="430" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="490" y1="580" x2="490" y2="610" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  </g>

  <g font-size="12" fill="#475569">
    <text x="335" y="284" text-anchor="middle">HTTP /api/v1</text>
    <text x="650" y="196" text-anchor="middle">业务数据</text>
    <text x="650" y="416" text-anchor="middle">原图</text>
    <text x="504" y="598">内部 HTTP</text>
  </g>

  <g>
    <circle cx="335" cy="300" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="335" y="305" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">1</text>

    <circle cx="490" cy="595" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="490" y="600" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">2</text>

    <circle cx="650" cy="210" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="650" y="215" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">3</text>

    <circle cx="650" cy="430" r="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="650" y="435" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">4</text>
  </g>

  <!-- optional LLM flow -->
  <path d="M 620 540 H 860 V 660 H 960" stroke="#db2777" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow-optional)"/>
  <text x="846" y="574" font-size="12" fill="#9d174d" text-anchor="end">解释层（已配置时）</text>
  <circle cx="860" cy="540" r="12" fill="#ffffff" stroke="#db2777" stroke-width="1.5"/>
  <text x="860" y="545" font-size="12" font-weight="700" fill="#db2777" text-anchor="middle">5</text>
</svg>
